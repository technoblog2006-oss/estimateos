  .app-shell, .full-screen-shell { height: 100vh; height: 100dvh; }
  .full-screen-shell { min-height: 100vh; min-height: 100dvh; height: auto; }

  /* The generic "collapse any grid to 1fr" rule above doesn't account for children

     spans need resetting too, or a child ends up sized for a grid that no longer

  @media (max-width: 640px) {

  }

function LineChartSVG({ data, height = 220, max = 10 }) {
  const w = 560, h = height, padL = 28, padB = 22, padT = 10, padR = 10;
  const innerW = w - padL - padR, innerH = h - padT - padB;
  const n = data.length;
  const pts = data.map((d, i) => {
    const x = padL + (n === 1 ? innerW / 2 : (i / (n - 1)) * innerW);
    const y = padT + innerH - (d.avg / max) * innerH;
    return { x, y, ...d };
  });
  const path = pts.map((p, i) => (i === 0 ? "M" : "L") + p.x.toFixed(1) + "," + p.y.toFixed(1)).join(" ");
  const gridYs = [0, 2.5, 5, 7.5, 10];
  return (
    <svg viewBox={"0 0 " + w + " " + h} width="100%" height={height} preserveAspectRatio="none">
      {gridYs.map((g) => {
        const y = padT + innerH - (g / max) * innerH;
        return <line key={g} x1={padL} x2={w - padR} y1={y} y2={y} stroke={C.borderSoft} strokeWidth="1" />;
      })}
      <path d={path} fill="none" stroke={C.blue} strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" />
      {pts.map((p, i) => <circle key={i} cx={p.x} cy={p.y} r="3.5" fill={C.blue} />)}
      {pts.map((p, i) => (
        <text key={"t" + i} x={p.x} y={h - 4} fontSize="10" fill={C.textDim} textAnchor="middle" fontFamily={FONT}>{p.week}</text>
      ))}
    </svg>
  );

function RadarSVG({ data, size = 260, max = 10 }) {
  const cx = size / 2, cy = size / 2, r = size / 2 - 34;
  const n = data.length;
  const angle = (i) => (Math.PI * 2 * i) / n - Math.PI / 2;
  const pt = (i, val) => {
    const a = angle(i), rr = (val / max) * r;
    return [cx + rr * Math.cos(a), cy + rr * Math.sin(a)];
  };
  const rings = [0.25, 0.5, 0.75, 1];
  const dataPts = data.map((d, i) => pt(i, d.value));
  const polyPoints = dataPts.map((p) => p[0].toFixed(1) + "," + p[1].toFixed(1)).join(" ");
  return (
    <svg viewBox={"0 0 " + size + " " + size} width="100%" height={size}>
      {rings.map((f) => {
        const ringPts = data.map((_, i) => pt(i, max * f)).map((p) => p[0].toFixed(1) + "," + p[1].toFixed(1)).join(" ");
        return <polygon key={f} points={ringPts} fill="none" stroke={C.borderSoft} strokeWidth="1" />;
      })}
      {data.map((_, i) => {
        const [x, y] = pt(i, max);
        return <line key={i} x1={cx} y1={cy} x2={x} y2={y} stroke={C.borderSoft} strokeWidth="1" />;
      })}
      <polygon points={polyPoints} fill={C.blue} fillOpacity="0.28" stroke={C.blue} strokeWidth="2" />
      {dataPts.map((p, i) => <circle key={i} cx={p[0]} cy={p[1]} r="3" fill={C.blue} />)}
      {data.map((d, i) => {
        const a = angle(i), lr = r + 18;
        const x = cx + lr * Math.cos(a), y = cy + lr * Math.sin(a);
        return <text key={"l" + i} x={x} y={y} fontSize="11" fill={C.textMid} textAnchor="middle" dominantBaseline="middle" fontFamily={FONT}>{d.skill}</text>;
      })}
    </svg>
  );
}

function useAnimatedNumber(target, duration = 700) {
  const [display, setDisplay] = useState(target);
  const prevRef = React.useRef(target);
  const firstRef = React.useRef(true);
  React.useEffect(() => {
    const from = firstRef.current ? 0 : prevRef.current;
    const to = target;
    firstRef.current = false;
    if (from === to) { setDisplay(to); prevRef.current = to; return; }
    let raf;
    const start = performance.now();
    const tick = (now) => {
      const t = Math.min(1, (now - start) / duration);
      const eased = 1 - Math.pow(1 - t, 3);
      setDisplay(from + (to - from) * eased);
      if (t < 1) { raf = requestAnimationFrame(tick); } else { setDisplay(to); prevRef.current = to; }
    };
    raf = requestAnimationFrame(tick);
    return () => raf && cancelAnimationFrame(raf);
  }, [target, duration]);
  return display;
}

function AnimatedNumber({ value, duration = 700, suffix = "" }) {
  const [display, setDisplay] = useState(0);
  const fromRef = React.useRef(0);
  React.useEffect(() => {
    const from = fromRef.current;
    const start = performance.now();
    let raf;
    const tick = (t) => {
      const p = Math.min(1, (t - start) / duration);
      const eased = 1 - Math.pow(1 - p, 3);
      setDisplay(Math.round(from + (value - from) * eased));
      if (p < 1) raf = requestAnimationFrame(tick); else fromRef.current = value;
    };
    raf = requestAnimationFrame(tick);
    return () => cancelAnimationFrame(raf);
  }, [value]);
  return <span style={{ fontVariantNumeric: "tabular-nums" }}>{display}{suffix}</span>;
}

function renderInline(line) {
  const parts = String(line).split(/(\*\*[^*]+\*\*)/g);
  return parts.map((part, i) => (part.startsWith("**") && part.endsWith("**"))
    ? <strong key={i}>{part.slice(2, -2)}</strong>
    : <React.Fragment key={i}>{part}</React.Fragment>);
}
function renderCoachText(text) {
  if (!text) return null;
  const paragraphs = String(text).split(/\n{2,}/);
  return paragraphs.map((para, pi) => {
    const lines = para.split("\n");
    const isList = lines.length > 1 && lines.every((l) => /^\s*[-*]\s+/.test(l));
    if (isList) {
      return (
        <ul key={pi} style={{ margin: "4px 0 8px", paddingLeft: 18 }}>
          {lines.map((l, li) => <li key={li} style={{ marginBottom: 4 }}>{renderInline(l.replace(/^\s*[-*]\s+/, ""))}</li>)}
        </ul>
      );
    }
    return (
      <p key={pi} style={{ margin: pi === 0 ? "0 0 8px" : "8px 0" }}>
        {lines.map((l, li) => <React.Fragment key={li}>{li > 0 && <br />}{renderInline(l)}</React.Fragment>)}
      </p>
    );
  });
}

/* ============================== PRODUCT CONFIG ============================== */
const STORAGE_KEY = "estimateos_state_v1";

/* Grading rubric. Weights favour method over the final number — that's how
   interviewers actually score guesstimates. Overall (0–100) is always computed
   here from the five dimension scores, never trusted from the model directly,
   so the number stays consistent across every attempt. */
const RUBRIC = [
  { key: "structure", label: "Structure", short: "Structure", weight: 0.3, desc: "A clear top-down breakdown into a logical equation or tree" },
  { key: "assumptions", label: "Assumptions", short: "Assumptions", weight: 0.25, desc: "Explicit, reasonable numbers with a reason behind each" },
  { key: "math", label: "Math", short: "Math", weight: 0.15, desc: "Correct arithmetic and consistent units" },
  { key: "sanity", label: "Sanity check", short: "Sanity", weight: 0.15, desc: "Cross-checks the answer against a real-world anchor" },
  { key: "communication", label: "Communication", short: "Clarity", weight: 0.15, desc: "Easy to follow, with a clearly stated final answer" },
];
const TARGET_MINUTES = { Easy: 5, Medium: 8, Hard: 12 };
const GOALS = ["Consulting interviews", "Product & tech interviews", "College admissions", "General practice"];
const LEVELS = ["New to guesstimates", "Some practice", "Interview-ready"];

function overallFromScores(scores) {
  return Math.round(RUBRIC.reduce((s, r) => s + clamp(Number(scores[r.key]) || 0, 0, 10) * r.weight, 0) * 10);
}
function scoreTone(v) { if (v === null || v === undefined) return C.textMid; if (v >= 75) return C.green; if (v >= 55) return C.goldDeep; return C.red; }
function scoreBand(v) { return v >= 85 ? "Interview-ready" : v >= 70 ? "Solid" : v >= 55 ? "Getting there" : "Needs work"; }
function fmtClock(sec) { const m = Math.floor(sec / 60), s = sec % 60; return m + ":" + String(s).padStart(2, "0"); }
function questionById(id) { return QUESTIONS.find((q) => q.id === id); }
function categoryByKey(k) { return CATEGORIES.find((c) => c.key === k) || { key: k, label: k }; }
function localDayKey(d) { return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
function uid() { return "a_" + Date.now().toString(36) + "_" + Math.random().toString(36).slice(2, 8); }

function loadState() { try { const raw = localStorage.getItem(STORAGE_KEY); return raw ? JSON.parse(raw) : null; } catch (e) { return null; } }
function saveState(s) { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(s)); } catch (e) { /* storage full or blocked — state stays in memory */ } }

function gradedAttempts(attempts) { return attempts.filter((a) => a.status === "graded" && a.grade); }

function computeStreak(attempts) {
  const days = new Set(attempts.map((a) => localDayKey(new Date(a.createdAt))));
  const cursor = new Date();
  let streak = 0;
  if (!days.has(localDayKey(cursor))) cursor.setDate(cursor.getDate() - 1);
  while (days.has(localDayKey(cursor))) { streak++; cursor.setDate(cursor.getDate() - 1); }
  return streak;
}

/* Everything the dashboard, coach and grader read about the student's history.
   attempts are stored newest first. */
function computeStats(attempts) {
  const graded = gradedAttempts(attempts);
  const recent = graded.slice(0, 10);
  const avgScore = recent.length ? Math.round(avg(recent.map((a) => a.grade.overall))) : null;
  const best = graded.length ? Math.max(...graded.map((a) => a.grade.overall)) : null;
  const rubricAvg = RUBRIC.map((r) => ({ ...r, value: recent.length ? round1(avg(recent.map((a) => a.grade.scores[r.key]))) : null }));
  const ranked = recent.length >= 2 ? [...rubricAvg].sort((a, b) => a.value - b.value) : [];
  const weakestDim = ranked.length ? ranked[0] : null;
  const strongestDim = ranked.length ? ranked[ranked.length - 1] : null;
  const catOf = (a) => (questionById(a.qid) || {}).cat;
  const byCat = CATEGORIES.map((c) => {
    const catGraded = graded.filter((a) => catOf(a) === c.key);
    const tried = new Set(attempts.filter((a) => catOf(a) === c.key).map((a) => a.qid)).size;
    const total = QUESTIONS.filter((q) => q.cat === c.key).length;
    return { ...c, avg: catGraded.length ? Math.round(avg(catGraded.map((a) => a.grade.overall))) : null, tried, total, count: catGraded.length };
  });
  const bestByQ = {};
  graded.forEach((a) => { bestByQ[a.qid] = Math.max(bestByQ[a.qid] === undefined ? -1 : bestByQ[a.qid], a.grade.overall); });
  const win = graded.slice(0, 12).reverse();
  const trend = win.map((a, i) => ({ avg: a.grade.overall / 10, week: "#" + (graded.length - win.length + i + 1) }));
  const covered = new Set(attempts.map((a) => a.qid)).size;
  const avgTimeSec = recent.length ? Math.round(avg(recent.map((a) => a.timeSec || 0))) : null;
  return { graded, avgScore, best, rubricAvg, weakestDim, strongestDim, byCat, bestByQ, trend, covered, avgTimeSec, streak: computeStreak(attempts), total: attempts.length };
}

/* Deterministic "what next" — updates instantly after every attempt, no credits.
   The AI insight card sits alongside it and refreshes whenever an answer is graded. */
function recommendNext(attempts, stats, profile) {
  const attemptedIds = new Set(attempts.map((a) => a.qid));
  let difficulty = profile.level === "Interview-ready" ? "Hard" : profile.level === "Some practice" ? "Medium" : "Easy";
  if (stats.avgScore !== null) difficulty = stats.avgScore >= 78 ? "Hard" : stats.avgScore >= 60 ? "Medium" : "Easy";
  const cats = [...stats.byCat].sort((a, b) => {
    if ((a.count === 0) !== (b.count === 0)) return a.count === 0 ? -1 : 1;
    if (a.count === 0) return a.tried - b.tried;
    return a.avg - b.avg;
  });
  const order = [difficulty, ...DIFFICULTIES.filter((d) => d !== difficulty)];
  for (const cat of cats) {
    const pool = QUESTIONS.filter((q) => q.cat === cat.key && !attemptedIds.has(q.id));
    for (const d of order) {
      const q = pool.find((x) => x.difficulty === d);
      if (q) {
        const why = cat.count === 0 ? "You haven't been graded on " + cat.label + " yet." : cat.label + " is your lowest-scoring category, averaging " + cat.avg + ".";
        return { question: q, reason: why + (d === difficulty ? " Pitched at " + d.toLowerCase() + " to match your current level." : "") };
      }
    }
  }
  const retake = [...QUESTIONS].sort((a, b) => (stats.bestByQ[a.id] === undefined ? 101 : stats.bestByQ[a.id]) - (stats.bestByQ[b.id] === undefined ? 101 : stats.bestByQ[b.id]))[0];
  return { question: retake, reason: "You've tried every question — this one has your lowest best score, so it's the best retake." };
}

function pickQuestion({ category, difficulty, questionId }, attempts) {
  if (questionId) { const exact = questionById(String(questionId).toLowerCase()); if (exact) return exact; }
  const attemptedIds = new Set(attempts.map((a) => a.qid));
  const low = String(category || "").toLowerCase();
  const cat = CATEGORIES.find((c) => low && (c.label.toLowerCase().includes(low) || low.includes(c.key) || low.includes(c.label.toLowerCase().split(" ")[0])));
  const diff = DIFFICULTIES.find((d) => d.toLowerCase() === String(difficulty || "").toLowerCase());
  let pool = QUESTIONS.filter((q) => (!cat || q.cat === cat.key) && (!diff || q.difficulty === diff));
  if (!pool.length) pool = QUESTIONS.filter((q) => !cat || q.cat === cat.key);
  return pool.find((q) => !attemptedIds.has(q.id)) || pool[0] || null;
}

/* ============================== BACKEND CALLS ==============================
   Same /api/chat endpoint and credit rules as ScoreOS: 1 credit per turnId,
   refunded server-side if the model fails. */
function codedError(code, message) { const e = new Error(message || code); e.code = code; return e; }
async function callChat(session, messages, turnId, tools) {
  const res = await fetch("/api/chat", {
    method: "POST",
    headers: { "Content-Type": "application/json", Authorization: "Bearer " + (session ? session.access_token : "") },
    body: JSON.stringify({ messages, tools: tools || [], turnId }),
  });
  if (res.status === 402) throw codedError("no_credits");
  if (res.status === 429) throw codedError("rate_limited");
  if (res.status === 401) throw codedError("auth", "Your session expired — sign in again.");
  if (!res.ok) { const body = await res.text().catch(() => ""); throw codedError("backend", "Request failed (" + res.status + "). " + body.slice(0, 160)); }
  return res.json();
}
function newTurnId() { return "t_" + Date.now().toString(36) + "_" + Math.random().toString(36).slice(2, 10); }

function extractJson(text) {
  if (!text) return null;
  const s = text.indexOf("{"), e = text.lastIndexOf("}");
  if (s < 0 || e <= s) return null;
  try { return JSON.parse(text.slice(s, e + 1)); } catch (err) { return null; }
}
function normalizeGrade(raw) {
  if (!raw || typeof raw !== "object" || !raw.scores || typeof raw.scores !== "object") return null;
  const scores = {};
  RUBRIC.forEach((r) => { scores[r.key] = clamp(Math.round(Number(raw.scores[r.key]) || 0), 0, 10); });
  const str = (v) => (typeof v === "string" ? v.trim() : "");
  const list = (v) => (Array.isArray(v) ? v.filter((x) => typeof x === "string" && x.trim()).map((x) => x.trim()).slice(0, 4) : str(v) ? [str(v)] : []);
  return {
    scores, overall: overallFromScores(scores), verdict: str(raw.verdict),
    strengths: list(raw.strengths), improvements: list(raw.improvements),
    modelApproach: str(raw.model_approach), mathIssues: str(raw.math_issues),
    nextStep: str(raw.next_step), trendInsight: str(raw.trend_insight),
  };
}

function buildGraderMessages({ attempt, question, profile, history }) {
  const historyLines = history.length
    ? history.map((a) => { const q = questionById(a.qid) || {}; return "- " + categoryByKey(q.cat).label + " (" + q.difficulty + "), overall " + a.grade.overall + ": " + RUBRIC.map((r) => r.short + " " + a.grade.scores[r.key]).join(", "); }).join("\n")
    : "No earlier graded attempts.";
  const system = [
    "You are a demanding but fair interviewer grading a candidate's written guesstimate answer. The candidate is preparing for: " + (profile.goal || "general practice") + ". Their self-described level: " + (profile.level || "unknown") + ".",
    "Grade the method far more than the final number — there is no single correct answer, but the path must be logical and the numbers defensible.",
    "Score each dimension from 0 to 10 using these anchors: 0-3 missing or wrong, 4-6 partial, 7-8 solid, 9-10 interview-ready.",
    RUBRIC.map((r) => "- " + r.key + ": " + r.desc).join("\n"),
    "Rules: Recompute every calculation yourself and put any errors in math_issues. Only award sanity above 4 if the candidate explicitly checks the result against something real. A bare number with no reasoning, an off-topic answer, or an empty answer scores 0-2 on every dimension. Do not reward length for its own sake.",
    "Write feedback directly to the candidate in plain sentences. No LaTeX, no markdown headers, no tables.",
    "trend_insight: one or two sentences on a pattern across this attempt AND their earlier attempts listed below (a recurring weak dimension, improvement, or habit). If there are no earlier attempts, describe the single habit most worth building.",
    "Respond with ONLY a JSON object, no text before or after, in exactly this shape:",
    '{"scores":{"structure":0,"assumptions":0,"math":0,"sanity":0,"communication":0},"verdict":"one sentence overall judgement","strengths":["..."],"improvements":["..."],"model_approach":"3-5 sentence outline of a strong approach to this exact question","math_issues":"specific arithmetic or unit errors, or empty string","next_step":"one concrete thing to do on the next attempt","trend_insight":"..."}',
  ].join("\n\n");
  const user = [
    "QUESTION: " + question.prompt,
    "CATEGORY: " + categoryByKey(question.cat).label + " | DIFFICULTY: " + question.difficulty + " | TYPE: " + question.type,
    "Reference drivers a strong answer usually covers (for you, not shown to the candidate): " + question.drivers.join("; "),
    "Time taken: " + fmtClock(attempt.timeSec || 0) + " (target " + TARGET_MINUTES[question.difficulty] + " min). Hint used: " + (attempt.hintUsed ? "yes" : "no") + ".",
    "EARLIER GRADED ATTEMPTS (most recent first):\n" + historyLines,
    "CANDIDATE'S ANSWER:\n" + (attempt.response || "(empty)"),
  ].join("\n\n");
  return [{ role: "system", content: system }, { role: "user", content: user }];
}

/* One credit per grade. If the model returns malformed JSON, retry once with the
   SAME turnId — the backend treats it as the same turn, so the retry is free. */
async function gradeWithAI({ session, attempt, question, profile, history }) {
  const turnId = newTurnId();
  const messages = buildGraderMessages({ attempt, question, profile, history });
  const first = await callChat(session, messages, turnId);
  const text1 = (((first.choices || [])[0] || {}).message || {}).content || "";
  let grade = normalizeGrade(extractJson(text1));
  if (grade) return grade;
  const retry = await callChat(session, messages.concat([{ role: "assistant", content: text1 || "(no content)" }, { role: "user", content: "That was not valid JSON. Reply again with only the JSON object in the exact shape requested." }]), turnId);
  const text2 = (((retry.choices || [])[0] || {}).message || {}).content || "";
  grade = normalizeGrade(extractJson(text2));
  if (!grade) throw codedError("parse", "The grader returned an unreadable result.");
  return grade;
}

function PracticeLibrary({ attempts, stats, drafts, onStart, recommendation }) {

  const list = QUESTIONS.filter((q) => (cat === "all" || q.cat === cat) && (diff === "all" || q.difficulty === diff) && (status === "all" || (status === "new" ? !tried.has(q.id) : tried.has(q.id))) && (!search.trim() || q.prompt.toLowerCase().includes(search.trim().toLowerCase())));

      <div style={{ display: "flex", gap: 8, flexWrap: "wrap", marginBottom: 10 }}>
        <Chip active={cat === "all"} onClick={() => setCat("all")}>All categories</Chip>

        <span style={{ width: 1, height: 20, background: C.border, margin: "0 4px" }} />
        {[["all", "All"], ["new", "Not tried"], ["tried", "Tried"]].map(([k, l]) => <Chip key={k} active={status === k} onClick={() => setStatus(k)}>{l}</Chip>)}

              <div style={{ flex: 1, minWidth: 0 }}>

                <div style={{ display: "flex", alignItems: "center", gap: 8, marginTop: 6, flexWrap: "wrap" }}>
                  <DifficultyTag d={q.difficulty} />

const ANSWER_TEMPLATE = "Clarify: \nStructure: \nAssumptions: \nCalculation: \nSanity check: \nFinal answer: ";
function PracticeWorkspace({ question, draft, setDraft, onBack, onSubmit, resultAttempt, bestScore, session, onOpenAccount, onGrade, onRetry, onNext, onAskCoach }) {
  const [text, setText] = useState(draft || "");
  const [hint, setHint] = useState(false);
  const [elapsed, setElapsed] = useState(0);
  const [warning, setWarning] = useState("");
  const startRef = React.useRef(Date.now());
  const done = !!resultAttempt;
  useEffect(() => {
    if (done) return;
    const t = setInterval(() => setElapsed(Math.floor((Date.now() - startRef.current) / 1000)), 1000);
    return () => clearInterval(t);
  }, [done]);
  const target = TARGET_MINUTES[question.difficulty] * 60;
  const over = elapsed > target;
  const words = text.trim() ? text.trim().split(/\s+/).length : 0;
  const change = (v) => { setText(v); setDraft(question.id, v); if (warning) setWarning(""); };
  const submit = () => {
    if (text.trim().length < 40) { setWarning("Write a bit more before submitting — at least your structure, a few assumptions and a final number."); return; }
    onSubmit({ qid: question.id, response: text.trim(), timeSec: elapsed, hintUsed: hint });
  };
  return (
    <div className="eos-page" style={{ maxWidth: 900 }}>
      <button onClick={onBack} style={{ background: "none", border: "none", color: C.textMid, fontSize: 13, cursor: "pointer", padding: 0, marginBottom: 16, fontFamily: FONT }}>← All questions</button>
      <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 10, flexWrap: "wrap" }}>
        <DifficultyTag d={question.difficulty} />
        <span style={{ fontSize: 12, color: C.textMid }}>{categoryByKey(question.cat).label}, {question.type.toLowerCase()}</span>
        {bestScore !== undefined && <span style={{ fontSize: 12, color: C.textMid }}>Your best: <strong style={{ color: scoreTone(bestScore) }}>{bestScore}</strong></span>}
      </div>
      <h1 style={{ margin: "0 0 18px", fontSize: 24, fontWeight: 740, letterSpacing: -.5, lineHeight: 1.3, maxWidth: 760 }}>{question.prompt}</h1>

      {done ? (
        <ResultPanel attempt={resultAttempt} question={question} session={session} onOpenAccount={onOpenAccount} onGrade={onGrade} onRetry={onRetry} onNext={onNext} onAskCoach={onAskCoach} />
      ) : (
        <div>
          <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: 10, marginBottom: 10, flexWrap: "wrap" }}>
            <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
              <span style={{ fontSize: 22, fontWeight: 750, fontVariantNumeric: "tabular-nums", color: over ? C.goldDeep : C.navy }} aria-live="off">{fmtClock(elapsed)}</span>
              <span style={{ fontSize: 12, color: C.textMid }}>{over ? "Past the " + TARGET_MINUTES[question.difficulty] + "-minute target — wrap up" : "Target " + TARGET_MINUTES[question.difficulty] + " minutes"}</span>
            </div>
            <div style={{ display: "flex", gap: 8 }}>
              {!text.trim() && <GhostButton onClick={() => change(ANSWER_TEMPLATE)} style={{ padding: "6px 12px", fontSize: 12 }}>Use answer outline</GhostButton>}
              <GhostButton onClick={() => setHint((v) => !v)} style={{ padding: "6px 12px", fontSize: 12 }}>{hint ? "Hide hint" : "Show hint"}</GhostButton>
            </div>
          </div>
          {hint && (
            <div style={{ background: C.goldSoft, border: "1px solid " + C.border, borderRadius: 12, padding: "12px 14px", marginBottom: 12, fontSize: 12.5, lineHeight: 1.55 }}>
              <div style={{ marginBottom: 6 }}>{question.tip}</div>
              <div style={{ color: C.textMid }}>A strong answer usually covers: {question.drivers.join("; ")}.</div>
              <div style={{ color: C.textDim, marginTop: 6, fontSize: 11.5 }}>Using the hint is recorded with this attempt.</div>
            </div>
          )}

/* ============================== COACH ============================== */
function CoachView({ profile, stats, attempts, recommendation, session, credits, refreshCredits, onOpenAccount, onStart, seed, clearSeed }) {
  const greetingText = session
    ? "Hi " + ((profile.name || "there").split(" ")[0]) + ". I can see your scores, your rubric breakdown and your recent answers. Ask me how to structure a question, why you're losing points, or for a question to practice."
    : "Sign in (top right) to talk to me — new accounts get 20 free credits.";
  const [messages, setMessages] = useState([{ id: "m0", from: "coach", text: greetingText }]);
  const [input, setInput] = useState(seed || "");
  const [sending, setSending] = useState(false);
  const historyRef = React.useRef([]);
  const bottomRef = React.useRef(null);
  useEffect(() => { if (seed) { setInput(seed); clearSeed(); } }, [seed]);
  useEffect(() => { setMessages((m) => (m.length === 1 ? [{ id: "m0", from: "coach", text: greetingText }] : m)); }, [!!session]);
  useEffect(() => { if (bottomRef.current) bottomRef.current.scrollIntoView({ behavior: "smooth", block: "end" }); }, [messages]);

  const send = async (raw) => {
    const text = (raw || "").trim();
    if (!text || sending) return;
    setInput("");
    const userMsg = { id: "u" + Date.now(), from: "user", text };
    if (!sb) { setMessages((m) => [...m, userMsg, { id: "c" + Date.now(), from: "coach", text: "The coach isn't connected on this deployment yet." }]); return; }
    if (!session) { setMessages((m) => [...m, userMsg, { id: "c" + Date.now(), from: "coach", text: "Sign in first (top right) — new accounts get 20 free credits." }]); onOpenAccount(); return; }
    const replyId = "c" + Date.now();
    setMessages((m) => [...m, userMsg, { id: replyId, from: "coach", text: "Thinking…", typing: true }]);
    setSending(true);
    const turnId = newTurnId();
    let working = [{ role: "system", content: buildCoachSystemPrompt({ profile, stats, attempts, recommendation }) }, ...historyRef.current, { role: "user", content: text }];
    let offered = null;
    try {
      let finalText = "";
      for (let round = 0; round < 4; round++) {
        const data = await callChat(session, working, turnId, COACH_TOOL_SCHEMAS.map((t) => ({ type: "function", function: t })));
        const message = ((data.choices || [])[0] || {}).message || {};
        const calls = message.tool_calls || [];
        if (calls.length) {
          const call = calls[0];
          let args = {};
          try { args = JSON.parse(call.function.arguments || "{}"); } catch (e) { args = {}; }
          let result = { ok: false, error: "unknown_tool" };
          if (call.function.name === "open_question") {
            const q = pickQuestion(args, attempts);
            if (q) { offered = q; result = { ok: true, questionId: q.id, prompt: q.prompt, category: categoryByKey(q.cat).label, difficulty: q.difficulty, note: "A start button for this question is shown under your reply." }; }
            else result = { ok: false, error: "No matching question." };
          }
          working = working.concat([{ role: "assistant", content: message.content || null, tool_calls: calls }, { role: "tool", tool_call_id: call.id, content: JSON.stringify(result) }]);
          continue;
        }
        finalText = message.content || "";
        working = working.concat([{ role: "assistant", content: finalText }]);
        break;
      }
      historyRef.current = working.slice(1).slice(-16);
      setMessages((m) => m.map((x) => (x.id === replyId ? { id: replyId, from: "coach", text: finalText || "…", qid: offered ? offered.id : null } : x)));
    } catch (err) {
      const msg = err.code === "no_credits" ? "You're out of credits — buy more from the account menu (top right)." : err.code === "rate_limited" ? "The coach is busy right now and your credit wasn't charged. Try again in a minute." : "Couldn't reach the coach. " + (err.message || "");
      setMessages((m) => m.map((x) => (x.id === replyId ? { id: replyId, from: "coach", text: msg } : x)));
    } finally {
      setSending(false);
      refreshCredits();
    }
  };

  return (
    <div className="eos-page" style={{ maxWidth: 900 }}>
      <div style={{ display: "flex", alignItems: "flex-end", justifyContent: "space-between", gap: 12, marginBottom: 18 }}>
        <div>
          <h1 style={{ margin: 0, fontSize: 28, fontWeight: 760, letterSpacing: -.7 }}>Coach</h1>
          <p style={{ margin: "7px 0 0", fontSize: 13.5, color: C.textMid }}>Ask about structuring, assumptions, mental math or your scores. Each message uses one credit.</p>
        </div>
        {session && <Pill style={{ background: C.navy, color: C.bg }}><Icons.Sparkles size={11} color={C.gold} />{credits === null ? "…" : credits} credits</Pill>}
      </div>
      <Card className="coach-card" style={{ padding: 20, borderRadius: 16, marginBottom: 14, display: "flex", flexDirection: "column" }}>
        {messages.map((m) => {
          const q = m.qid ? questionById(m.qid) : null;
          return (
            <div key={m.id}>
              <CoachMessage from={m.from} text={m.text} typing={m.typing} />
              {q && (
                <button className="press" onClick={() => onStart(q.id)} style={{ margin: "-4px 0 14px", display: "flex", alignItems: "center", gap: 10, maxWidth: "82%", textAlign: "left", background: C.navy, color: C.bg, border: "none", borderRadius: 12, padding: "10px 14px", cursor: "pointer", fontFamily: FONT }}>
                  <Icons.Target size={14} color={C.gold} />
                  <span style={{ fontSize: 12.5, lineHeight: 1.4 }}><strong>Start this question:</strong> {q.prompt}</span>
                </button>
              )}
            </div>
          );
        })}
        <div ref={bottomRef} />
      </Card>
      <div style={{ display: "flex", gap: 8, flexWrap: "wrap", marginBottom: 12 }}>
        {COACH_QUICK.map((q) => <Chip key={q} active={false} onClick={() => send(q)}>{q}</Chip>)}
      </div>
      <div style={{ display: "flex", gap: 8, alignItems: "flex-end" }}>
        <textarea value={input} onChange={(e) => setInput(e.target.value)} onKeyDown={(e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(input); } }} rows={input.length > 90 ? 4 : 1} placeholder="Ask anything — Enter to send, Shift+Enter for a new line" style={{ ...inputStyle, flex: 1, resize: "vertical", lineHeight: 1.5, fontSize: 13.5 }} />
        <PrimaryButton onClick={() => send(input)} style={{ opacity: sending ? 0.6 : 1 }}>Send</PrimaryButton>
      </div>
    </div>
  );
}

/* ============================== ROOT ============================== */
function EstimateOS() {
  const persisted = useMemo(() => loadState(), []);
  const [profile, setProfile] = useState((persisted && persisted.profile) || null);
  const [attempts, setAttempts] = useState((persisted && persisted.attempts) || []);
  const [drafts, setDrafts] = useState((persisted && persisted.drafts) || {});
  const [insight, setInsight] = useState((persisted && persisted.insight) || null);
  const [active, setActive] = useState("dashboard");
  const [openQid, setOpenQid] = useState(null);
  const [resultId, setResultId] = useState(null);
  const [workspaceNonce, setWorkspaceNonce] = useState(0);
  const [modalAttemptId, setModalAttemptId] = useState(null);
  const [coachSeed, setCoachSeed] = useState("");
  const [toast, setToast] = useState(null);
  const [mobileNavOpen, setMobileNavOpen] = useState(false);
  const attemptsRef = React.useRef(attempts);
  useEffect(() => { attemptsRef.current = attempts; }, [attempts]);

  /* ---- Account: same Supabase auth + credits as ScoreOS ---- */
  const [session, setSession] = useState(null);
  const [credits, setCredits] = useState(null);
  const [accountOpen, setAccountOpen] = useState(false);
  const sessionRef = React.useRef(null);
  useEffect(() => { sessionRef.current = session; }, [session]);
  const refreshCredits = async (s) => {
    const cur = s || sessionRef.current;
    if (!sb || !cur) { setCredits(null); return; }
    try { const res = await fetch("/api/me", { headers: { Authorization: "Bearer " + cur.access_token } }); if (res.ok) { const d = await res.json(); setCredits(d.credits); } } catch (e) { /* stale until next success */ }
  };
  useEffect(() => {
    if (!sb) return;
    sb.auth.getSession().then(({ data }) => { setSession(data.session); if (data.session) refreshCredits(data.session); });
    const { data: sub } = sb.auth.onAuthStateChange((_e, s) => { setSession(s); if (s) refreshCredits(s); else setCredits(null); });
    const params = new URLSearchParams(window.location.search);
    if (params.get("checkout")) { if (params.get("checkout") === "success") setAccountOpen(true); window.history.replaceState({}, "", window.location.pathname); }
    return () => sub.subscription.unsubscribe();
  }, []);
  const sendMagicLink = async (email) => {
    if (!sb) return { ok: false, message: "Sign-in isn't configured on this deployment." };
    const { error } = await sb.auth.signInWithOtp({ email, options: { emailRedirectTo: window.location.origin + window.location.pathname } });
    return error ? { ok: false, message: error.message } : { ok: true, message: "Check your email for a sign-in link." };
  };
  const signOutAccount = async () => { if (sb) await sb.auth.signOut(); };
  const buyCreditPack = async (pack) => {
    if (!session) return { ok: false, message: "Sign in first." };
    try {
      const res = await fetch("/api/checkout", { method: "POST", headers: { "Content-Type": "application/json", Authorization: "Bearer " + session.access_token }, body: JSON.stringify({ pack }) });
      const d = await res.json().catch(() => ({}));
      if (res.ok && d.url) { window.location.href = d.url; return { ok: true }; }
      return { ok: false, message: "Payments aren't set up on this site yet. Your free credits still work." };
    } catch (e) { return { ok: false, message: "Couldn't open checkout. Check your connection and try again." }; }
  };

  useEffect(() => { if (profile) saveState({ profile, attempts, drafts, insight }); }, [profile, attempts, drafts, insight]);

  const stats = useMemo(() => computeStats(attempts), [attempts]);
  const recommendation = useMemo(() => recommendNext(attempts, stats, profile || {}), [attempts, stats, profile]);

  const updateAttempt = (id, patch) => setAttempts((prev) => prev.map((a) => (a.id === id ? { ...a, ...patch } : a)));
  const setDraft = (qid, text) => setDrafts((d) => ({ ...d, [qid]: text }));

  const runGrade = async (attemptId) => {
    const s = sessionRef.current;
    const attempt = attemptsRef.current.find((a) => a.id === attemptId);
    if (!attempt) return;
    if (!s) { setAccountOpen(true); return; }
    updateAttempt(attemptId, { status: "grading", error: null });
    try {
      const history = gradedAttempts(attemptsRef.current).filter((a) => a.id !== attemptId).slice(0, 5);
      const prevBest = history.length ? Math.max(...gradedAttempts(attemptsRef.current).map((a) => a.grade.overall)) : null;
      const grade = await gradeWithAI({ session: s, attempt, question: questionById(attempt.qid), profile, history });
      updateAttempt(attemptId, { status: "graded", grade, gradedAt: new Date().toISOString() });
      if (grade.trendInsight || grade.nextStep) setInsight({ text: grade.trendInsight, nextStep: grade.nextStep, updatedAt: new Date().toISOString() });
      if (prevBest === null) setToast({ label: "First answer graded", desc: "Your dashboard is now tracking your skills" });
      else if (grade.overall > prevBest) setToast({ label: "New best score", desc: grade.overall + " out of 100" });
    } catch (e) {
      const message = e.code === "no_credits" ? "You're out of credits. Buy more from the account menu, then grade it again."
        : e.code === "rate_limited" ? "The grader is busy right now and your credit wasn't charged. Try again in a minute."
        : e.code === "parse" ? "The grader returned an unreadable result. Try grading again."
        : e.code === "auth" ? e.message
        : "Couldn't reach the grader. " + (e.message || "");
      updateAttempt(attemptId, { status: "error", error: message });
    } finally {
      refreshCredits();
    }
  };
  const submitAttempt = ({ qid, response, timeSec, hintUsed }) => {
    const attempt = { id: uid(), qid, response, timeSec, hintUsed, createdAt: new Date().toISOString(), status: session ? "grading" : "pending", grade: null };
    attemptsRef.current = [attempt, ...attemptsRef.current];
    setAttempts((prev) => [attempt, ...prev]);
    setDrafts((d) => { const n = { ...d }; delete n[qid]; return n; });
    setResultId(attempt.id);
    if (session) runGrade(attempt.id);
  };
  const startQuestion = (qid) => { setOpenQid(qid); setResultId(null); setWorkspaceNonce((n) => n + 1); setModalAttemptId(null); setActive("practice"); };
  const askCoachAbout = (attempt) => {
    const q = questionById(attempt.qid) || {};
    const g = attempt.grade;
    setCoachSeed("I answered \"" + q.prompt + "\"" + (g ? " and scored " + g.overall + ". The grader said: " + g.verdict : "") + "\n\nMy answer was:\n" + (attempt.response || "").slice(0, 900) + "\n\nWhat should I change to score higher next time?");
    setModalAttemptId(null);
    setActive("coach");
  };
  const resetData = () => { setAttempts([]); setDrafts({}); setInsight(null); setOpenQid(null); setResultId(null); };

  if (!profile) return <WelcomeScreen onFinish={(p) => setProfile(p)} />;

  const navLabel = (NAV_ITEMS.find((n) => n.key === active) || {}).label || (active === "settings" ? "Profile & settings" : "");
  const openQuestion = openQid ? questionById(openQid) : null;
  const resultAttempt = resultId ? attempts.find((a) => a.id === resultId && a.qid === openQid) : null;
  const modalAttempt = modalAttemptId ? attempts.find((a) => a.id === modalAttemptId) : null;

  let content;
  if (active === "dashboard") content = <DashboardView profile={profile} stats={stats} insight={insight} recommendation={recommendation} onStart={startQuestion} onOpenAttempt={setModalAttemptId} setActive={setActive} />;
  else if (active === "practice") content = openQuestion
    ? <PracticeWorkspace key={openQid + ":" + workspaceNonce} question={openQuestion} draft={drafts[openQid]} setDraft={setDraft} onBack={() => { setOpenQid(null); setResultId(null); }} onSubmit={submitAttempt} resultAttempt={resultAttempt} bestScore={stats.bestByQ[openQid]} session={session} onOpenAccount={() => setAccountOpen(true)} onGrade={runGrade} onRetry={() => startQuestion(openQid)} onNext={() => startQuestion(recommendation.question.id)} onAskCoach={askCoachAbout} />
    : <PracticeLibrary attempts={attempts} stats={stats} drafts={drafts} onStart={startQuestion} recommendation={recommendation} />;
  else if (active === "history") content = <HistoryView attempts={attempts} onOpen={setModalAttemptId} onStartPractice={() => setActive("practice")} />;
  else if (active === "coach") content = <CoachView profile={profile} stats={stats} attempts={attempts} recommendation={recommendation} session={session} credits={credits} refreshCredits={refreshCredits} onOpenAccount={() => setAccountOpen(true)} onStart={startQuestion} seed={coachSeed} clearSeed={() => setCoachSeed("")} />;
  else if (active === "settings") content = <SettingsView profile={profile} setProfile={setProfile} onReset={resetData} />;

  return (
    <div className="app-shell" style={{ display: "flex", flexDirection: "column", width: "100%", background: C.bg, fontFamily: FONT, color: C.text, position: "relative", overflow: "hidden" }}>
      <div className="bg-texture" /><div className="grain-overlay" />
      <div style={{ display: "flex", flex: 1, minHeight: 0, position: "relative", zIndex: 1 }}>
        <Sidebar active={active} setActive={(k) => { setActive(k); if (k !== "practice") setOpenQid(null); }} stats={stats} />
        <div className="app-main-col" style={{ flex: 1, display: "flex", flexDirection: "column", minWidth: 0, overflow: "hidden" }}>
          <Topbar userName={profile.name} avgScore={stats.avgScore} viewLabel={navLabel} setMobileNavOpen={setMobileNavOpen} session={session} credits={credits} onOpenAccount={() => setAccountOpen(true)} />
          <div key={active + (openQid || "")} className="view-in scoreos-canvas" style={{ flex: 1, overflowY: "auto" }}>{content}</div>
        </div>
      </div>
      <MobileNavDrawer open={mobileNavOpen} onClose={() => setMobileNavOpen(false)} active={active} setActive={(k) => { setActive(k); if (k !== "practice") setOpenQid(null); }} />
      <Modal open={!!modalAttempt} onClose={() => setModalAttemptId(null)} title={modalAttempt ? (questionById(modalAttempt.qid) || {}).prompt : ""} width={720}>
        {modalAttempt && <ResultPanel attempt={modalAttempt} question={questionById(modalAttempt.qid)} session={session} onOpenAccount={() => setAccountOpen(true)} onGrade={runGrade} onRetry={() => startQuestion(modalAttempt.qid)} onAskCoach={askCoachAbout} showAnswer />}
      </Modal>
      <AchievementToast achievement={toast} onDone={() => setToast(null)} />
      <AccountModal open={accountOpen} onClose={() => setAccountOpen(false)} session={session} credits={credits} onSendLink={sendMagicLink} onSignOut={signOutAccount} onBuyPack={buyCreditPack} />
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<EstimateOS />);

</script>
</body>
</html>
