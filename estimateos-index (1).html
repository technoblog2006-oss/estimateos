function LineChartSVG({ data, height = 220, max = 10 }) {
  const w = 560, h = height, padL = 28, padB = 22, padT = 10, padR = 10;
  const innerW = w - padL - padR, innerH = h - padT - padB;
  const n = data.length;
  const pts = data.map((d, i) => {
    const x = padL + (n === 1 ? innerW / 2 : (i / (n - 1)) * innerW);
    const y = padT + innerH - (d.avg / max) * innerH;
    return { x, y, ...d };
  });
  const path = pts.map((p, i) => (i === 0 ? "M" : "L") + p.x.toFixed(1) + "," + p.y.toFixed(1)).join(" ");
  const gridYs = [0, 2.5, 5, 7.5, 10];
  return (
    <svg viewBox={"0 0 " + w + " " + h} width="100%" height={height} preserveAspectRatio="none">
      {gridYs.map((g) => {
        const y = padT + innerH - (g / max) * innerH;
        return <line key={g} x1={padL} x2={w - padR} y1={y} y2={y} stroke={C.borderSoft} strokeWidth="1" />;
      })}
      <path d={path} fill="none" stroke={C.blue} strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" />
      {pts.map((p, i) => <circle key={i} cx={p.x} cy={p.y} r="3.5" fill={C.blue} />)}
      {pts.map((p, i) => (
        <text key={"t" + i} x={p.x} y={h - 4} fontSize="10" fill={C.textDim} textAnchor="middle" fontFamily={FONT}>{p.week}</text>
      ))}
    </svg>
  );
}
function RadarSVG({ data, size = 260, max = 10 }) {
  const cx = size / 2, cy = size / 2, r = size / 2 - 34;
  const n = data.length;
  const angle = (i) => (Math.PI * 2 * i) / n - Math.PI / 2;
  const pt = (i, val) => {
    const a = angle(i), rr = (val / max) * r;
    return [cx + rr * Math.cos(a), cy + rr * Math.sin(a)];
  };
  const rings = [0.25, 0.5, 0.75, 1];
  const dataPts = data.map((d, i) => pt(i, d.value));
  const polyPoints = dataPts.map((p) => p[0].toFixed(1) + "," + p[1].toFixed(1)).join(" ");
  return (
    <svg viewBox={"0 0 " + size + " " + size} width="100%" height={size}>
      {rings.map((f) => {
        const ringPts = data.map((_, i) => pt(i, max * f)).map((p) => p[0].toFixed(1) + "," + p[1].toFixed(1)).join(" ");
        return <polygon key={f} points={ringPts} fill="none" stroke={C.borderSoft} strokeWidth="1" />;
      })}
      {data.map((_, i) => {
        const [x, y] = pt(i, max);
        return <line key={i} x1={cx} y1={cy} x2={x} y2={y} stroke={C.borderSoft} strokeWidth="1" />;
      })}

function useAnimatedNumber(target, duration = 700) {
  const [display, setDisplay] = useState(target);
  const prevRef = React.useRef(target);
  const firstRef = React.useRef(true);
  React.useEffect(() => {
    const from = firstRef.current ? 0 : prevRef.current;
    const to = target;
    firstRef.current = false;
    if (from === to) { setDisplay(to); prevRef.current = to; return; }
    let raf;
    const start = performance.now();
    const tick = (now) => {
      const t = Math.min(1, (now - start) / duration);
      const eased = 1 - Math.pow(1 - t, 3);
      setDisplay(from + (to - from) * eased);
      if (t < 1) { raf = requestAnimationFrame(tick); } else { setDisplay(to); prevRef.current = to; }
    };
    raf = requestAnimationFrame(tick);
    return () => raf && cancelAnimationFrame(raf);
  }, [target, duration]);
  return display;
}
function Card({ children, style, ...rest }) { return <div style={{ background: C.panel, border: "1px solid " + C.border, borderRadius: 14, ...style }} {...rest}>{children}</div>; }
function Pill({ children, tone = "default", style, className }) {

  const t = tones[tone] || tones.default;
  return <span className={className} style={{ display: "inline-flex", alignItems: "center", gap: 5, padding: "3px 9px", borderRadius: 999, fontSize: 12, fontWeight: 500, background: t.bg, color: t.fg, whiteSpace: "nowrap", ...style }}>{children}</span>;
}

}
function AnimatedNumber({ value, duration = 700, suffix = "" }) {
  const [display, setDisplay] = useState(0);
  const fromRef = React.useRef(0);
  React.useEffect(() => {
    const from = fromRef.current;
    const start = performance.now();
    let raf;
    const tick = (t) => {
      const p = Math.min(1, (t - start) / duration);
      const eased = 1 - Math.pow(1 - p, 3);
      setDisplay(Math.round(from + (value - from) * eased));
      if (p < 1) raf = requestAnimationFrame(tick); else fromRef.current = value;
    };
    raf = requestAnimationFrame(tick);
    return () => cancelAnimationFrame(raf);
  }, [value]);
  return <span style={{ fontVariantNumeric: "tabular-nums" }}>{display}{suffix}</span>;
}
function TrendTag({ delta, suffix = "" }) {
  if (delta === undefined || delta === null || Math.abs(delta) < 0.05) return <span style={{ display: "inline-flex", alignItems: "center", gap: 3, fontSize: 12, color: C.textDim }}><Icons.Minus size={11} />flat</span>;
  const up = delta > 0;
  return <span style={{ display: "inline-flex", alignItems: "center", gap: 3, fontSize: 12, color: up ? C.green : C.red }}>{up ? <Icons.TrendUp size={11} /> : <Icons.TrendDown size={11} />}{up ? "+" : ""}{delta.toFixed(1)}{suffix}</span>;
}
function ReadinessRing({ value, size = 108, stroke = 9 }) {
  const animated = useAnimatedNumber(value);
  const r = (size - stroke) / 2, circ = 2 * Math.PI * r, offset = circ - (clamp(animated, 0, 100) / 100) * circ;
  const color = value >= 75 ? C.green : value >= 55 ? C.amber : C.red;
  return (
    <div style={{ position: "relative", width: size, height: size }}>
      <svg width={size} height={size} style={{ transform: "rotate(-90deg)" }}>
        <circle cx={size / 2} cy={size / 2} r={r} stroke={C.borderSoft} strokeWidth={stroke} fill="none" />

function renderInline(line) {
  const parts = String(line).split(/(\*\*[^*]+\*\*)/g);
  return parts.map((part, i) => (part.startsWith("**") && part.endsWith("**"))
    ? <strong key={i}>{part.slice(2, -2)}</strong>
    : <React.Fragment key={i}>{part}</React.Fragment>);
}
function renderCoachText(text) {
  if (!text) return null;
  const paragraphs = String(text).split(/\n{2,}/);
  return paragraphs.map((para, pi) => {
    const lines = para.split("\n");
    const isList = lines.length > 1 && lines.every((l) => /^\s*[-*]\s+/.test(l));
    if (isList) {
      return (
        <ul key={pi} style={{ margin: "4px 0 8px", paddingLeft: 18 }}>
          {lines.map((l, li) => <li key={li} style={{ marginBottom: 4 }}>{renderInline(l.replace(/^\s*[-*]\s+/, ""))}</li>)}
        </ul>
      );
    }
    return (
      <p key={pi} style={{ margin: pi === 0 ? "0 0 8px" : "8px 0" }}>
        {lines.map((l, li) => <React.Fragment key={li}>{li > 0 && <br />}{renderInline(l)}</React.Fragment>)}
      </p>
    );
  });
}
function CoachMessage({ from, text, typing }) {

}

/* ============================== PRODUCT CONFIG ============================== */
const STORAGE_KEY = "estimateos_state_v1";

/* Grading rubric. Weights favour method over the final number — that's how
   interviewers actually score guesstimates. Overall (0–100) is always computed
   here from the five dimension scores, never trusted from the model directly,
   so the number stays consistent across every attempt. */
const RUBRIC = [
  { key: "structure", label: "Structure", short: "Structure", weight: 0.3, desc: "A clear top-down breakdown into a logical equation or tree" },
  { key: "assumptions", label: "Assumptions", short: "Assumptions", weight: 0.25, desc: "Explicit, reasonable numbers with a reason behind each" },
  { key: "math", label: "Math", short: "Math", weight: 0.15, desc: "Correct arithmetic and consistent units" },
  { key: "sanity", label: "Sanity check", short: "Sanity", weight: 0.15, desc: "Cross-checks the answer against a real-world anchor" },
  { key: "communication", label: "Communication", short: "Clarity", weight: 0.15, desc: "Easy to follow, with a clearly stated final answer" },
];
const TARGET_MINUTES = { Easy: 5, Medium: 8, Hard: 12 };
const GOALS = ["Consulting interviews", "Product & tech interviews", "College admissions", "General practice"];
const LEVELS = ["New to guesstimates", "Some practice", "Interview-ready"];

function overallFromScores(scores) {
  return Math.round(RUBRIC.reduce((s, r) => s + clamp(Number(scores[r.key]) || 0, 0, 10) * r.weight, 0) * 10);
}
function scoreTone(v) { if (v === null || v === undefined) return C.textMid; if (v >= 75) return C.green; if (v >= 55) return C.goldDeep; return C.red; }
function scoreBand(v) { return v >= 85 ? "Interview-ready" : v >= 70 ? "Solid" : v >= 55 ? "Getting there" : "Needs work"; }
function fmtClock(sec) { const m = Math.floor(sec / 60), s = sec % 60; return m + ":" + String(s).padStart(2, "0"); }
function questionById(id) { return QUESTIONS.find((q) => q.id === id); }
function categoryByKey(k) { return CATEGORIES.find((c) => c.key === k) || { key: k, label: k }; }
function localDayKey(d) { return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
function uid() { return "a_" + Date.now().toString(36) + "_" + Math.random().toString(36).slice(2, 8); }

function loadState() { try { const raw = localStorage.getItem(STORAGE_KEY); return raw ? JSON.parse(raw) : null; } catch (e) { return null; } }
function saveState(s) { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(s)); } catch (e) { /* storage full or blocked — state stays in memory */ } }

function gradedAttempts(attempts) { return attempts.filter((a) => a.status === "graded" && a.grade); }

function computeStreak(attempts) {
  const days = new Set(attempts.map((a) => localDayKey(new Date(a.createdAt))));
  const cursor = new Date();
  let streak = 0;
  if (!days.has(localDayKey(cursor))) cursor.setDate(cursor.getDate() - 1);
  while (days.has(localDayKey(cursor))) { streak++; cursor.setDate(cursor.getDate() - 1); }
  return streak;
}

/* Everything the dashboard, coach and grader read about the student's history.
   attempts are stored newest first. */
function computeStats(attempts) {
  const graded = gradedAttempts(attempts);
  const recent = graded.slice(0, 10);
  const avgScore = recent.length ? Math.round(avg(recent.map((a) => a.grade.overall))) : null;
  const best = graded.length ? Math.max(...graded.map((a) => a.grade.overall)) : null;
  const rubricAvg = RUBRIC.map((r) => ({ ...r, value: recent.length ? round1(avg(recent.map((a) => a.grade.scores[r.key]))) : null }));
  const ranked = recent.length >= 2 ? [...rubricAvg].sort((a, b) => a.value - b.value) : [];
  const weakestDim = ranked.length ? ranked[0] : null;
  const strongestDim = ranked.length ? ranked[ranked.length - 1] : null;
  const catOf = (a) => (questionById(a.qid) || {}).cat;
  const byCat = CATEGORIES.map((c) => {
    const catGraded = graded.filter((a) => catOf(a) === c.key);
    const tried = new Set(attempts.filter((a) => catOf(a) === c.key).map((a) => a.qid)).size;
    const total = QUESTIONS.filter((q) => q.cat === c.key).length;
    return { ...c, avg: catGraded.length ? Math.round(avg(catGraded.map((a) => a.grade.overall))) : null, tried, total, count: catGraded.length };
  });
  const bestByQ = {};
  graded.forEach((a) => { bestByQ[a.qid] = Math.max(bestByQ[a.qid] === undefined ? -1 : bestByQ[a.qid], a.grade.overall); });
  const win = graded.slice(0, 12).reverse();
  const trend = win.map((a, i) => ({ avg: a.grade.overall / 10, week: "#" + (graded.length - win.length + i + 1) }));
  const covered = new Set(attempts.map((a) => a.qid)).size;
  const avgTimeSec = recent.length ? Math.round(avg(recent.map((a) => a.timeSec || 0))) : null;
  return { graded, avgScore, best, rubricAvg, weakestDim, strongestDim, byCat, bestByQ, trend, covered, avgTimeSec, streak: computeStreak(attempts), total: attempts.length };
}

/* Deterministic "what next" — updates instantly after every attempt, no credits.
   The AI insight card sits alongside it and refreshes whenever an answer is graded. */
function recommendNext(attempts, stats, profile) {
  const attemptedIds = new Set(attempts.map((a) => a.qid));
  let difficulty = profile.level === "Interview-ready" ? "Hard" : profile.level === "Some practice" ? "Medium" : "Easy";
  if (stats.avgScore !== null) difficulty = stats.avgScore >= 78 ? "Hard" : stats.avgScore >= 60 ? "Medium" : "Easy";
  const cats = [...stats.byCat].sort((a, b) => {
    if ((a.count === 0) !== (b.count === 0)) return a.count === 0 ? -1 : 1;
    if (a.count === 0) return a.tried - b.tried;
    return a.avg - b.avg;
  });
  const order = [difficulty, ...DIFFICULTIES.filter((d) => d !== difficulty)];
  for (const cat of cats) {
    const pool = QUESTIONS.filter((q) => q.cat === cat.key && !attemptedIds.has(q.id));
    for (const d of order) {
      const q = pool.find((x) => x.difficulty === d);
      if (q) {
        const why = cat.count === 0 ? "You haven't been graded on " + cat.label + " yet." : cat.label + " is your lowest-scoring category, averaging " + cat.avg + ".";
        return { question: q, reason: why + (d === difficulty ? " Pitched at " + d.toLowerCase() + " to match your current level." : "") };
      }
    }
  }
  const retake = [...QUESTIONS].sort((a, b) => (stats.bestByQ[a.id] === undefined ? 101 : stats.bestByQ[a.id]) - (stats.bestByQ[b.id] === undefined ? 101 : stats.bestByQ[b.id]))[0];
  return { question: retake, reason: "You've tried every question — this one has your lowest best score, so it's the best retake." };
}

function pickQuestion({ category, difficulty, questionId }, attempts) {
  if (questionId) { const exact = questionById(String(questionId).toLowerCase()); if (exact) return exact; }
  const attemptedIds = new Set(attempts.map((a) => a.qid));
  const low = String(category || "").toLowerCase();
  const cat = CATEGORIES.find((c) => low && (c.label.toLowerCase().includes(low) || low.includes(c.key) || low.includes(c.label.toLowerCase().split(" ")[0])));
  const diff = DIFFICULTIES.find((d) => d.toLowerCase() === String(difficulty || "").toLowerCase());
  let pool = QUESTIONS.filter((q) => (!cat || q.cat === cat.key) && (!diff || q.difficulty === diff));
  if (!pool.length) pool = QUESTIONS.filter((q) => !cat || q.cat === cat.key);
  return pool.find((q) => !attemptedIds.has(q.id)) || pool[0] || null;
}

/* ============================== BACKEND CALLS ==============================
   Same /api/chat endpoint and credit rules as ScoreOS: 1 credit per turnId,
   refunded server-side if the model fails. */
function codedError(code, message) { const e = new Error(message || code); e.code = code; return e; }
async function callChat(session, messages, turnId, tools) {
  const res = await fetch("/api/chat", {
    method: "POST",
    headers: { "Content-Type": "application/json", Authorization: "Bearer " + (session ? session.access_token : "") },
    body: JSON.stringify({ messages, tools: tools || [], turnId }),
  });
  if (res.status === 402) throw codedError("no_credits");
  if (res.status === 429) throw codedError("rate_limited");
  if (res.status === 401) throw codedError("auth", "Your session expired — sign in again.");
  if (!res.ok) { const body = await res.text().catch(() => ""); throw codedError("backend", "Request failed (" + res.status + "). " + body.slice(0, 160)); }
  return res.json();
}
function newTurnId() { return "t_" + Date.now().toString(36) + "_" + Math.random().toString(36).slice(2, 10); }

function extractJson(text) {
  if (!text) return null;
  const s = text.indexOf("{"), e = text.lastIndexOf("}");
  if (s < 0 || e <= s) return null;
  try { return JSON.parse(text.slice(s, e + 1)); } catch (err) { return null; }
}
function normalizeGrade(raw) {
  if (!raw || typeof raw !== "object" || !raw.scores || typeof raw.scores !== "object") return null;
  const scores = {};
  RUBRIC.forEach((r) => { scores[r.key] = clamp(Math.round(Number(raw.scores[r.key]) || 0), 0, 10); });
  const str = (v) => (typeof v === "string" ? v.trim() : "");
  const list = (v) => (Array.isArray(v) ? v.filter((x) => typeof x === "string" && x.trim()).map((x) => x.trim()).slice(0, 4) : str(v) ? [str(v)] : []);
  return {
    scores, overall: overallFromScores(scores), verdict: str(raw.verdict),
    strengths: list(raw.strengths), improvements: list(raw.improvements),
    modelApproach: str(raw.model_approach), mathIssues: str(raw.math_issues),
    nextStep: str(raw.next_step), trendInsight: str(raw.trend_insight),
  };
}

function buildGraderMessages({ attempt, question, profile, history }) {
  const historyLines = history.length
    ? history.map((a) => { const q = questionById(a.qid) || {}; return "- " + categoryByKey(q.cat).label + " (" + q.difficulty + "), overall " + a.grade.overall + ": " + RUBRIC.map((r) => r.short + " " + a.grade.scores[r.key]).join(", "); }).join("\n")
    : "No earlier graded attempts.";
  const system = [
    "You are a demanding but fair interviewer grading a candidate's written guesstimate answer. The candidate is preparing for: " + (profile.goal || "general practice") + ". Their self-described level: " + (profile.level || "unknown") + ".",
    "Grade the method far more than the final number — there is no single correct answer, but the path must be logical and the numbers defensible.",
    "Score each dimension from 0 to 10 using these anchors: 0-3 missing or wrong, 4-6 partial, 7-8 solid, 9-10 interview-ready.",
    RUBRIC.map((r) => "- " + r.key + ": " + r.desc).join("\n"),
    "Rules: Recompute every calculation yourself and put any errors in math_issues. Only award sanity above 4 if the candidate explicitly checks the result against something real. A bare number with no reasoning, an off-topic answer, or an empty answer scores 0-2 on every dimension. Do not reward length for its own sake.",
    "Write feedback directly to the candidate in plain sentences. No LaTeX, no markdown headers, no tables.",
    "trend_insight: one or two sentences on a pattern across this attempt AND their earlier attempts listed below (a recurring weak dimension, improvement, or habit). If there are no earlier attempts, describe the single habit most worth building.",
    "Respond with ONLY a JSON object, no text before or after, in exactly this shape:",
    '{"scores":{"structure":0,"assumptions":0,"math":0,"sanity":0,"communication":0},"verdict":"one sentence overall judgement","strengths":["..."],"improvements":["..."],"model_approach":"3-5 sentence outline of a strong approach to this exact question","math_issues":"specific arithmetic or unit errors, or empty string","next_step":"one concrete thing to do on the next attempt","trend_insight":"..."}',
  ].join("\n\n");
  const user = [
    "QUESTION: " + question.prompt,
    "CATEGORY: " + categoryByKey(question.cat).label + " | DIFFICULTY: " + question.difficulty + " | TYPE: " + question.type,
    "Reference drivers a strong answer usually covers (for you, not shown to the candidate): " + question.drivers.join("; "),
    "Time taken: " + fmtClock(attempt.timeSec || 0) + " (target " + TARGET_MINUTES[question.difficulty] + " min). Hint used: " + (attempt.hintUsed ? "yes" : "no") + ".",
    "EARLIER GRADED ATTEMPTS (most recent first):\n" + historyLines,
    "CANDIDATE'S ANSWER:\n" + (attempt.response || "(empty)"),
  ].join("\n\n");
  return [{ role: "system", content: system }, { role: "user", content: user }];
}

/* One credit per grade. If the model returns malformed JSON, retry once with the
   SAME turnId — the backend treats it as the same turn, so the retry is free. */
async function gradeWithAI({ session, attempt, question, profile, history }) {
  const turnId = newTurnId();
  const messages = buildGraderMessages({ attempt, question, profile, history });
  const first = await callChat(session, messages, turnId);
  const text1 = (((first.choices || [])[0] || {}).message || {}).content || "";
  let grade = normalizeGrade(extractJson(text1));
  if (grade) return grade;
  const retry = await callChat(session, messages.concat([{ role: "assistant", content: text1 || "(no content)" }, { role: "user", content: "That was not valid JSON. Reply again with only the JSON object in the exact shape requested." }]), turnId);
  const text2 = (((retry.choices || [])[0] || {}).message || {}).content || "";
  grade = normalizeGrade(extractJson(text2));
  if (!grade) throw codedError("parse", "The grader returned an unreadable result.");
  return grade;
}

/* ============================== GAMIFICATION ==============================
   Everything here is derived from saved attempts, so XP, levels, quests and
   badges need no extra storage and can never drift out of sync with History. */
const HAND = "'Caveat', 'Segoe Print', 'Bradley Hand', cursive";
const LEVEL_TITLES = ["Napkin Scribbler", "Ballpark Rookie", "Order-of-Magnitude Apprentice", "Fermi Cadet", "Assumption Architect", "Sanity Checker", "Market Sizer", "Back-of-Envelope Pro", "Fermi Master", "Estimation Legend"];
const QUEST_XP = 25, ALL_QUESTS_BONUS = 25;

function levelStart(level) { return 50 * (level - 1) * level; }
function levelInfo(xp) {
  let level = 1;
  while (xp >= levelStart(level + 1)) level++;
  const start = levelStart(level), next = levelStart(level + 1);
  return { level, title: LEVEL_TITLES[Math.min(level - 1, LEVEL_TITLES.length - 1)], xp, start, next, toNext: next - xp, pct: Math.round(((xp - start) / (next - start)) * 100) };
}
function chronological(attempts) { return [...attempts].sort((a, b) => new Date(a.createdAt) - new Date(b.createdAt)); }
function isGraded(a) { return a.status === "graded" && !!a.grade; }
function bestBefore(prior, qid) {
  let b = null;
  prior.forEach((p) => { if (p.qid === qid && isGraded(p)) b = b === null ? p.grade.overall : Math.max(b, p.grade.overall); });
  return b;
}
function withinTarget(a) { const q = questionById(a.qid); return !!q && (a.timeSec || 0) <= TARGET_MINUTES[q.difficulty] * 60; }

function xpItemsForAttempt(a, prior) {
  const items = [{ key: "submit", label: "Answer submitted", xp: 5 }];
  if (!prior.some((p) => p.qid === a.qid)) items.push({ key: "new", label: "First try at this question", xp: 20 });
  if (isGraded(a)) {
    const g = a.grade;
    items.push({ key: "score", label: "Scored " + g.overall, xp: g.overall });
    const pb = bestBefore(prior, a.qid);
    if (pb !== null && g.overall > pb) items.push({ key: "beat", label: "Beat your best of " + pb, xp: 15 });
    if (g.scores.sanity >= 7) items.push({ key: "sanity", label: "Checked your answer against reality", xp: 10 });
    if (withinTarget(a) && g.overall >= 60) items.push({ key: "clock", label: "Finished inside the target time", xp: 10 });
  }
  return items;
}

/* Daily quests: three per day, picked deterministically from the date so they're
   the same on every device and reload. */
const QUEST_POOL = [
  { id: "grade1", label: "Get one answer graded", test: (d) => d.graded.length >= 1, progress: (d) => [Math.min(d.graded.length, 1), 1] },
  { id: "grade3", label: "Get three answers graded", test: (d) => d.graded.length >= 3, progress: (d) => [Math.min(d.graded.length, 3), 3] },
  { id: "sanity", label: "Score 7 or more on sanity check", test: (d) => d.graded.some((a) => a.grade.scores.sanity >= 7) },
  { id: "structure", label: "Score 8 or more on structure", test: (d) => d.graded.some((a) => a.grade.scores.structure >= 8) },
  { id: "seventy", label: "Score 70 or higher on any answer", test: (d) => d.graded.some((a) => a.grade.overall >= 70) },
  { id: "hard", label: "Answer a hard question", test: (d) => d.all.some((a) => (questionById(a.qid) || {}).difficulty === "Hard") },
  { id: "clock", label: "Finish an answer inside the target time", test: (d) => d.all.some(withinTarget) },
  { id: "newcat", label: "Try a category you haven't touched", test: (d) => d.all.some((a) => { const c = (questionById(a.qid) || {}).cat; return !d.prior.some((p) => (questionById(p.qid) || {}).cat === c); }) },
  { id: "beat", label: "Beat your best score on any question", test: (d) => d.graded.some((a) => { const pb = bestBefore(d.before(a), a.qid); return pb !== null && a.grade.overall > pb; }) },
  { id: "nohint", label: "Score 60 or more without the hint", test: (d) => d.graded.some((a) => !a.hintUsed && a.grade.overall >= 60) },
];
function hashStr(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
function questsForDay(dayKey) {
  const h = hashStr(dayKey);
  const first = h % 3 === 0 ? QUEST_POOL[1] : QUEST_POOL[0];
  const rest = QUEST_POOL.slice(2);
  const a = rest[h % rest.length];
  let b = rest[Math.floor(h / 11) % rest.length];
  if (b === a) b = rest[(rest.indexOf(a) + 3) % rest.length];
  return [first, a, b];
}
function evalDay(dayKey, chron) {
  const all = chron.filter((a) => localDayKey(new Date(a.createdAt)) === dayKey);
  const firstIdx = chron.indexOf(all[0]);
  const d = { all, graded: all.filter(isGraded), prior: firstIdx < 0 ? chron : chron.slice(0, firstIdx), before: (a) => chron.slice(0, chron.indexOf(a)) };
  return questsForDay(dayKey).map((q) => ({ id: q.id, label: q.label, done: !!q.test(d), progress: q.progress ? q.progress(d) : null }));
}
function maxStreak(dayKeys) {
  const sorted = [...dayKeys].sort();
  let best = 0, run = 0, prev = null;
  sorted.forEach((k) => {
    const t = new Date(k + "T00:00:00").getTime();
    run = prev !== null && Math.round((t - prev) / 86400000) === 1 ? run + 1 : 1;
    best = Math.max(best, run); prev = t;
  });
  return best;
}

/* Badges are stamps — `mark` is what's written inside the red-pen circle. */
const BADGES = [
  { id: "first", mark: "1st", label: "First estimate", desc: "Submit your first answer", test: (s) => s.chron.length >= 1 },
  { id: "graded", mark: "A+", label: "On the record", desc: "Get your first answer graded", test: (s) => s.graded.length >= 1 },
  { id: "seventy", mark: "70", label: "Solid ground", desc: "Score 70 or higher", test: (s) => s.graded.some((a) => a.grade.overall >= 70) },
  { id: "ready", mark: "85", label: "Interview-ready", desc: "Score 85 or higher", test: (s) => s.graded.some((a) => a.grade.overall >= 85) },
  { id: "sanity", mark: "✓", label: "Sanity saint", desc: "Score 9 or more on sanity check", test: (s) => s.graded.some((a) => a.grade.scores.sanity >= 9) },
  { id: "tree", mark: "tree", label: "Tree surgeon", desc: "Score 9 or more on structure", test: (s) => s.graded.some((a) => a.grade.scores.structure >= 9) },
  { id: "math", mark: "10", label: "Calculator brain", desc: "Get a perfect 10 on math", test: (s) => s.graded.some((a) => a.grade.scores.math === 10) },
  { id: "hard", mark: "hard", label: "Hard hitter", desc: "Score 75+ on a hard question", test: (s) => s.graded.some((a) => (questionById(a.qid) || {}).difficulty === "Hard" && a.grade.overall >= 75) },
  { id: "speed", mark: "fast", label: "Beat the clock", desc: "Score 70+ in half the target time", test: (s) => s.graded.some((a) => { const q = questionById(a.qid); return q && a.grade.overall >= 70 && (a.timeSec || 0) <= TARGET_MINUTES[q.difficulty] * 30; }) },
  { id: "comeback", mark: "+20", label: "Comeback", desc: "Improve a question's best by 20+", test: (s) => s.graded.some((a) => { const pb = bestBefore(s.before(a), a.qid); return pb !== null && a.grade.overall - pb >= 20; }) },
  { id: "five", mark: "5×", label: "Five in a day", desc: "Get five answers graded in one day", test: (s) => { const c = {}; s.graded.forEach((a) => { const k = localDayKey(new Date(a.createdAt)); c[k] = (c[k] || 0) + 1; }); return Object.values(c).some((n) => n >= 5); } },
  { id: "streak3", mark: "3d", label: "Warming up", desc: "Practice three days in a row", test: (s) => s.maxStreak >= 3 },
  { id: "streak7", mark: "7d", label: "Habit formed", desc: "Practice seven days in a row", test: (s) => s.maxStreak >= 7 },
  { id: "explorer", mark: "all", label: "Explorer", desc: "Try every category", test: (s) => s.cats >= CATEGORIES.length },
  { id: "bank", mark: "50", label: "Full bank", desc: "Try all 50 questions", test: (s) => s.covered >= QUESTIONS.length },
];

function computeGame(attempts) {
  const chron = chronological(attempts);
  let xp = 0;
  chron.forEach((a, i) => { xp += xpItemsForAttempt(a, chron.slice(0, i)).reduce((sum, x) => sum + x.xp, 0); });
  const days = [...new Set(chron.map((a) => localDayKey(new Date(a.createdAt))))];
  days.forEach((dk) => { const n = evalDay(dk, chron).filter((q) => q.done).length; xp += n * QUEST_XP + (n === 3 ? ALL_QUESTS_BONUS : 0); });
  const graded = chron.filter(isGraded);
  const s = { chron, graded, maxStreak: maxStreak(days), covered: new Set(chron.map((a) => a.qid)).size, cats: new Set(chron.map((a) => (questionById(a.qid) || {}).cat)).size, before: (a) => chron.slice(0, chron.indexOf(a)) };
  const badges = BADGES.map((b) => ({ id: b.id, mark: b.mark, label: b.label, desc: b.desc, earned: !!b.test(s) }));
  return { xp, level: levelInfo(xp), todayQuests: evalDay(localDayKey(new Date()), chron), badges };
}

/* What changed between two snapshots — drives the reward list, toasts and confetti. */
function rewardDiff(before, after, attempt, afterAttempts, includeSubmit) {
  const chron = chronological(afterAttempts);
  const idx = chron.findIndex((a) => a.id === attempt.id);
  let items = xpItemsForAttempt(chron[idx], chron.slice(0, idx));
  if (!includeSubmit) items = items.filter((x) => x.key !== "submit" && x.key !== "new");
  after.todayQuests.forEach((q, i) => { if (q.done && !(before.todayQuests[i] || {}).done) items.push({ key: "quest-" + q.id, label: "Quest done: " + q.label.toLowerCase(), xp: QUEST_XP }); });
  const allNow = after.todayQuests.every((q) => q.done), allBefore = before.todayQuests.every((q) => q.done);
  if (allNow && !allBefore) items.push({ key: "allquests", label: "All three of today's quests", xp: ALL_QUESTS_BONUS });
  const newBadges = after.badges.filter((b, i) => b.earned && !before.badges[i].earned);
  return {
    items, newBadges, total: after.xp - before.xp,
    levelUp: after.level.level > before.level.level ? after.level : null,
    beatBest: items.some((x) => x.key === "beat"), allQuests: allNow && !allBefore,
  };
}

function prefersReducedMotion() { return !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches); }
/* Confetti (Magic UI's Confetti wraps canvas-confetti; same library, loaded from a CDN). */
function celebrate(size) {
  if (!window.confetti || prefersReducedMotion()) return;
  const colors = ["#1B2A6B", "#D63A2F", "#FFD84D", "#178A4C", "#FFFFFF"];
  if (size === "big") {
    window.confetti({ particleCount: 120, spread: 75, startVelocity: 42, origin: { y: 0.62 }, colors });
    setTimeout(() => {
      window.confetti({ particleCount: 70, angle: 60, spread: 58, origin: { x: 0, y: 0.75 }, colors });
      window.confetti({ particleCount: 70, angle: 120, spread: 58, origin: { x: 1, y: 0.75 }, colors });
    }, 220);
  } else {
    window.confetti({ particleCount: 60, spread: 55, startVelocity: 34, origin: { y: 0.68 }, colors });
  }
}

// Magic UI AnimatedCircularProgressBar — ring that animates to its new value.
function ProgressRing({ value, size = 96, stroke = 8, color = C.navy, track = C.panelAlt, children }) {
  const r = (size - stroke) / 2, circ = 2 * Math.PI * r;
  return (
    <div style={{ position: "relative", width: size, height: size, flexShrink: 0 }}>
      <svg width={size} height={size} style={{ transform: "rotate(-90deg)" }} aria-hidden="true">
        <circle cx={size / 2} cy={size / 2} r={r} stroke={track} strokeWidth={stroke} fill="none" />
        <circle cx={size / 2} cy={size / 2} r={r} stroke={color} strokeWidth={stroke} fill="none" strokeLinecap="round" strokeDasharray={circ} strokeDashoffset={circ * (1 - clamp(value, 0, 100) / 100)} style={{ transition: "stroke-dashoffset 1s cubic-bezier(.22,1,.36,1)" }} />
      </svg>
      <div style={{ position: "absolute", inset: 0, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center" }}>{children}</div>
    </div>
  );
}
// Magic UI / React Bits AnimatedList — items arrive one after another.
function AnimatedList({ items, render, stagger = 160 }) {
  return <div>{items.map((it, i) => <div key={it.key || i} className="list-pop" style={{ animationDelay: (i * stagger) + "ms" }}>{render(it, i)}</div>)}</div>;
}

        <H1>{greeting}, {(profile.name || "there").split(" ")[0]}.</H1>
        <Lede>{stats.total === 0 ? "Answer one question to start earning XP. Every answer gets marked like an interview would." : "You've tried " + stats.covered + " of " + QUESTIONS.length + " questions. Here's where to put your next ten minutes."}</Lede>
      </div>

      <div className="eos-grid" style={{ display: "grid", gridTemplateColumns: "1fr 1.15fr", gap: 16, marginBottom: 16 }}>
        <LevelSheet game={game} streak={stats.streak} />
        <QuestBoard quests={game.todayQuests} onGo={() => onStart(q.id)} />
      </div>

      <div className="next-up" style={{ background: C.navy, color: "#fff", borderRadius: 18, padding: "24px 26px", marginBottom: 16, display: "flex", gap: 24, alignItems: "flex-end", justifyContent: "space-between", flexWrap: "wrap" }}>
        <div style={{ flex: "1 1 380px", minWidth: 0 }}>
          <div style={{ fontSize: 13, color: "rgba(255,255,255,.7)", marginBottom: 8 }}>Your next question</div>
          <div style={{ fontSize: 22, fontWeight: 650, lineHeight: 1.3, letterSpacing: -.3, maxWidth: 640 }}>{q.prompt}</div>
          <div style={{ fontSize: 13, color: "rgba(255,255,255,.75)", marginTop: 10, lineHeight: 1.55, maxWidth: 600 }}>{recommendation.reason}</div>
        </div>
        <div style={{ display: "flex", flexDirection: "column", alignItems: "flex-start", gap: 8 }}>
          <ShimmerButton onClick={() => onStart(q.id)}>Start answering</ShimmerButton>
          <span style={{ fontSize: 12, color: "rgba(255,255,255,.65)" }}>{q.difficulty}, about {TARGET_MINUTES[q.difficulty]} minutes</span>
        </div>
      </div>

      <div style={{ marginBottom: 16 }}><StatStrip stats={stats} /></div>

      <div className="eos-grid" style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 16, marginBottom: 16 }}>
        <div className="sheet" style={{ padding: 22 }}>
          <div style={{ fontFamily: HAND, fontSize: 26, color: C.red, lineHeight: 1, marginBottom: 10 }}>Grader's notes</div>
          {insight && insight.text ? (
            <div>
              <p style={{ margin: 0, fontSize: 14, lineHeight: 1.6 }}>{insight.text}</p>
              {insight.nextStep && <p style={{ margin: "12px 0 0", fontSize: 13.5, lineHeight: 1.55, color: C.navy, background: C.paleBlue, borderRadius: 10, padding: "10px 12px" }}><strong>Next time:</strong> {insight.nextStep}</p>}
              <div style={{ marginTop: 10, fontSize: 11.5, color: C.textDim }}>Written after your answer on {fmtDate(new Date(insight.updatedAt))}.</div>
            </div>
          ) : <p style={{ margin: 0, fontSize: 13.5, color: C.textMid, lineHeight: 1.6 }}>After each graded answer, the grader compares it with your earlier ones and notes the pattern here.</p>}
        </div>
        <div className="sheet" style={{ padding: 22 }}>
          <SectionHead>Skill profile</SectionHead>
          {stats.graded.length ? (
            <div>
              <RadarSVG data={stats.rubricAvg.map((r) => ({ skill: r.short, value: r.value }))} size={230} max={10} />
              {stats.weakestDim && <p style={{ margin: 0, fontSize: 13, lineHeight: 1.5 }}>Weakest habit: <strong>{stats.weakestDim.label.toLowerCase()}</strong>, averaging {stats.weakestDim.value} out of 10.</p>}
            </div>
          ) : <p style={{ margin: 0, fontSize: 13.5, color: C.textMid }}>Your five rubric scores appear after your first graded answer.</p>}
        </div>
      </div>

      <div style={{ marginBottom: 16 }}><BadgeShelf badges={game.badges} /></div>

      <div className="eos-grid" style={{ display: "grid", gridTemplateColumns: "1.1fr 1fr", gap: 16, marginBottom: 16 }}>
        <div className="sheet" style={{ padding: 22 }}>
          <SectionHead>Score trend</SectionHead>
          {stats.trend.length >= 2 ? <LineChartSVG data={stats.trend} height={200} max={10} /> : <p style={{ margin: 0, fontSize: 13.5, color: C.textMid }}>Grade two answers to see the line. Scores are shown out of 10.</p>}
        </div>
        <div className="sheet" style={{ padding: 22 }}>
          <SectionHead>By category</SectionHead>
          <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
            {stats.byCat.map((c) => (
              <div key={c.key} style={{ display: "flex", alignItems: "center", gap: 10, fontSize: 12.5 }}>
                <span className="eos-cat-label" style={{ width: 150, flexShrink: 0 }}>{c.label}</span>
                <div style={{ flex: 1, height: 6, background: C.panelAlt, borderRadius: 99, overflow: "hidden" }}><div style={{ width: (c.avg || 0) + "%", height: "100%", background: c.avg === null ? "transparent" : c.avg >= 70 ? C.navy : c.avg >= 55 ? "#E8B400" : C.red, borderRadius: 99 }} /></div>
                <span style={{ width: 78, flexShrink: 0, textAlign: "right", color: c.avg === null ? C.textDim : C.text, fontVariantNumeric: "tabular-nums" }}>{c.avg === null ? c.tried + "/" + c.total + " tried" : c.avg + " avg"}</span>
              </div>
            ))}
          </div>
        </div>
      </div>

      <div className="sheet" style={{ padding: 22 }}>
        <SectionHead right={stats.total > 0 && <button onClick={() => setActive("history")} style={{ background: "none", border: "none", color: C.navy, fontSize: 13, cursor: "pointer", fontFamily: FONT, fontWeight: 650 }}>See all</button>}>Recent answers</SectionHead>
        {stats.total === 0 ? <p style={{ margin: 0, fontSize: 13.5, color: C.textMid }}>Nothing yet. Your next question is waiting above.</p> : <RecentList attempts={stats.graded.slice(0, 5)} onOpen={onOpenAttempt} />}
        {stats.total > 0 && stats.graded.length === 0 && <p style={{ margin: 0, fontSize: 13.5, color: C.textMid }}>Your answers are saved but not graded. Sign in to grade them from History.</p>}
      </div>
    </div>
  );
}
function RecentList({ attempts, onOpen }) {
  return (
    <div>
      {attempts.map((a) => {
        const q = questionById(a.qid) || { prompt: "Unknown question" };
        return (
          <button key={a.id} onClick={() => onOpen(a.id)} style={{ width: "100%", display: "flex", alignItems: "center", justifyContent: "space-between", gap: 12, padding: "10px 0", border: "none", borderTop: "1px solid " + C.borderSoft, background: "none", cursor: "pointer", textAlign: "left", fontFamily: FONT }}>
            <span style={{ fontSize: 13, color: C.text, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{q.prompt}</span>
            <AttemptBadge attempt={a} />
          </button>
        );
      })}
    </div>
  );
}
function AttemptBadge({ attempt }) {
  if (attempt.status === "graded") return <span style={{ fontFamily: HAND, fontSize: 22, fontWeight: 700, color: C.red, lineHeight: 1, flexShrink: 0 }}>{attempt.grade.overall}</span>;
  const label = attempt.status === "grading" ? "Grading…" : attempt.status === "error" ? "Not graded" : "Needs grading";
  return <span style={{ fontSize: 12, fontWeight: 600, color: attempt.status === "error" ? C.red : C.goldDeep, flexShrink: 0 }}>{label}</span>;
}

/* ============================== PRACTICE ============================== */
function PracticeLibrary({ attempts, stats, drafts, onStart, recommendation }) {
  const [cat, setCat] = useState("all");
  const [diff, setDiff] = useState("all");
  const [status, setStatus] = useState("all");
  const [search, setSearch] = useState("");
  const tried = new Set(attempts.map((a) => a.qid));
  const list = QUESTIONS.filter((q) => (cat === "all" || q.cat === cat) && (diff === "all" || q.difficulty === diff) && (status === "all" || (status === "new" ? !tried.has(q.id) : tried.has(q.id))) && (!search.trim() || q.prompt.toLowerCase().includes(search.trim().toLowerCase())));
  return (
    <div className="eos-page">
      <H1>Practice</H1>
      <Lede style={{ marginBottom: 20 }}>Write your answer the way you'd say it out loud in an interview. It's marked on structure, assumptions, math, sanity check and clarity. New questions are worth 20 bonus XP.</Lede>
      <div style={{ display: "flex", gap: 8, flexWrap: "wrap", marginBottom: 10 }}>
        <Chip active={cat === "all"} onClick={() => setCat("all")}>All categories</Chip>
        {CATEGORIES.map((c) => <Chip key={c.key} active={cat === c.key} onClick={() => setCat(c.key)}>{c.label}</Chip>)}
      </div>
      <div style={{ display: "flex", gap: 8, flexWrap: "wrap", marginBottom: 18, alignItems: "center" }}>
        {["all", ...DIFFICULTIES].map((d) => <Chip key={d} active={diff === d} onClick={() => setDiff(d)}>{d === "all" ? "Any difficulty" : d}</Chip>)}
        <span style={{ width: 1, height: 20, background: C.border, margin: "0 4px" }} />
        {[["all", "All"], ["new", "Not tried"], ["tried", "Tried"]].map(([k, l]) => <Chip key={k} active={status === k} onClick={() => setStatus(k)}>{l}</Chip>)}
        <div style={{ flex: "1 1 200px", minWidth: 180 }}><TextInput value={search} onChange={(e) => setSearch(e.target.value)} placeholder="Search questions" aria-label="Search questions" /></div>
      </div>
      <div className="sheet" style={{ overflow: "hidden" }}>
        {list.length === 0 && <div style={{ padding: 22, fontSize: 13.5, color: C.textMid }}>No questions match. Clear a filter to see more.</div>}
        {list.map((q, i) => {
          const best = stats.bestByQ[q.id];
          const isRec = recommendation.question && recommendation.question.id === q.id;
          return (
            <button key={q.id} onClick={() => onStart(q.id)} className="press row-btn" style={{ width: "100%", display: "flex", alignItems: "center", gap: 14, padding: "14px 18px", border: "none", borderTop: i ? "1px solid " + C.borderSoft : "none", background: isRec ? C.paleBlue : "transparent", cursor: "pointer", textAlign: "left", fontFamily: FONT }}>
              <div style={{ flex: 1, minWidth: 0 }}>
                <div style={{ fontSize: 14, color: C.text, fontWeight: 550, lineHeight: 1.4 }}>{q.prompt}</div>
                <div style={{ display: "flex", alignItems: "center", gap: 8, marginTop: 6, flexWrap: "wrap" }}>
                  <DifficultyTag d={q.difficulty} />
                  <span style={{ fontSize: 12, color: C.textMid }}>{categoryByKey(q.cat).label}</span>
                  {isRec && <span style={{ fontSize: 12, color: C.navy, fontWeight: 650 }}>Recommended</span>}
                  {drafts[q.id] && <span style={{ fontSize: 12, color: C.goldDeep }}>Draft saved</span>}
                </div>
              </div>
              <div style={{ textAlign: "right", flexShrink: 0, minWidth: 54 }}>
                {best !== undefined ? <span style={{ fontFamily: HAND, fontSize: 26, fontWeight: 700, color: C.red, lineHeight: 1 }}>{best}</span> : tried.has(q.id) ? <span style={{ fontSize: 12, color: C.goldDeep }}>Ungraded</span> : <span style={{ fontSize: 12, fontWeight: 650, color: C.goldDeep, background: C.goldSoft, borderRadius: 999, padding: "3px 8px" }}>+20 XP</span>}
              </div>
            </button>
          );
        })}
      </div>
    </div>
  );
}

const ANSWER_TEMPLATE = "What I'm estimating: \nHow I'll break it down: \nAssumptions: \nMath: \nSanity check: \nFinal answer: ";
function PracticeWorkspace({ question, draft, setDraft, onBack, onSubmit, resultAttempt, reward, bestScore, session, onOpenAccount, onGrade, onRetry, onNext, onAskCoach }) {
  const [text, setText] = useState(draft || "");
  const [hint, setHint] = useState(false);
  const [elapsed, setElapsed] = useState(0);
  const [warning, setWarning] = useState("");
  const startRef = React.useRef(Date.now());
  const done = !!resultAttempt;
  useEffect(() => { if (done) return; const t = setInterval(() => setElapsed(Math.floor((Date.now() - startRef.current) / 1000)), 1000); return () => clearInterval(t); }, [done]);
  const target = TARGET_MINUTES[question.difficulty] * 60;
  const over = elapsed > target;
  const words = text.trim() ? text.trim().split(/\s+/).length : 0;
  const change = (v) => { setText(v); setDraft(question.id, v); if (warning) setWarning(""); };
  const submit = () => {
    if (text.trim().length < 40) { setWarning("Add a bit more first: how you'll break it down, a few assumptions, and a final number."); return; }
    onSubmit({ qid: question.id, response: text.trim(), timeSec: elapsed, hintUsed: hint });
  };
  return (
    <div className="eos-page" style={{ maxWidth: 920 }}>
      <button onClick={onBack} style={{ background: "none", border: "none", color: C.textMid, fontSize: 13, cursor: "pointer", padding: 0, marginBottom: 16, fontFamily: FONT }}>Back to all questions</button>
      <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 10, flexWrap: "wrap" }}>
        <DifficultyTag d={question.difficulty} />
        <span style={{ fontSize: 12.5, color: C.textMid }}>{categoryByKey(question.cat).label}, {question.type.toLowerCase()}</span>
        {bestScore !== undefined && <span style={{ fontSize: 12.5, color: C.textMid }}>Your best: <span style={{ fontFamily: HAND, fontSize: 19, color: C.red, fontWeight: 700 }}>{bestScore}</span></span>}
      </div>
      <H1 style={{ fontSize: 25, marginBottom: 18, maxWidth: 780, lineHeight: 1.3 }}>{question.prompt}</H1>
      {done ? (
        <ResultPanel attempt={resultAttempt} reward={reward} session={session} onOpenAccount={onOpenAccount} onGrade={onGrade} onRetry={onRetry} onNext={onNext} onAskCoach={onAskCoach} />
      ) : (
        <div>
          <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: 10, marginBottom: 10, flexWrap: "wrap" }}>
            <div style={{ display: "flex", alignItems: "baseline", gap: 10 }}>
              <span style={{ fontSize: 24, fontWeight: 720, fontVariantNumeric: "tabular-nums", color: over ? C.red : C.navy }}>{fmtClock(elapsed)}</span>
              <span style={{ fontSize: 12.5, color: C.textMid }}>{over ? "Past the " + TARGET_MINUTES[question.difficulty] + "-minute mark. Wrap up." : "Finish inside " + TARGET_MINUTES[question.difficulty] + " minutes for +10 XP"}</span>
            </div>
            <div style={{ display: "flex", gap: 8 }}>
              {!text.trim() && <GhostButton onClick={() => change(ANSWER_TEMPLATE)} style={{ padding: "6px 12px", fontSize: 12.5 }}>Use the outline</GhostButton>}
              <GhostButton onClick={() => setHint((v) => !v)} style={{ padding: "6px 12px", fontSize: 12.5 }}>{hint ? "Hide hint" : "Show hint"}</GhostButton>
            </div>
          </div>
          {hint && (
            <div style={{ background: C.goldSoft, border: "1px solid #F2DD8C", borderRadius: 12, padding: "12px 14px", marginBottom: 12, fontSize: 13, lineHeight: 1.55 }}>
              <div style={{ marginBottom: 6 }}>{question.tip}</div>
              <div style={{ color: C.textMid }}>Strong answers usually cover {question.drivers.join(", ").toLowerCase()}.</div>
              <div style={{ color: C.textDim, marginTop: 6, fontSize: 12 }}>Using the hint is noted on this attempt.</div>
            </div>
          )}
          <textarea className="eos-editor" value={text} onChange={(e) => change(e.target.value)} aria-label="Your answer" placeholder={"Say what you're estimating and for what period. Break it into pieces, put a number on each one and say why. Show the math, check it against something real, and finish with one clear number."} style={{ width: "100%", boxSizing: "border-box", minHeight: 320, background: C.panel, border: "1px solid " + C.border, borderRadius: 14, padding: "16px 18px", fontSize: 14.5, lineHeight: 1.7, color: C.text, fontFamily: FONT, resize: "vertical", outline: "none" }} />
          <div className="eos-workspace-actions" style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: 12, marginTop: 10 }}>
            <span style={{ fontSize: 12.5, color: C.textDim }}>{words} words. Your draft saves as you type.</span>
            <PrimaryButton onClick={submit} style={{ justifyContent: "center", padding: "11px 18px", fontSize: 13.5 }}>{session ? (session.artifact ? "Submit for grading" : "Submit for grading (1 credit)") : "Save answer"}</PrimaryButton>
          </div>
          {!session && <div style={{ marginTop: 8, fontSize: 12.5, color: C.textMid, textAlign: "right" }}>Sign in to get it graded. Saved answers can be graded later from History.</div>}
          {warning && <div role="alert" style={{ marginTop: 10, fontSize: 13, color: C.red }}>{warning}</div>}
        </div>
      )}
    </div>
  );
}

function ResultPanel({ attempt, reward, session, onOpenAccount, onGrade, onRetry, onNext, onAskCoach, showAnswer }) {
  const [answerOpen, setAnswerOpen] = useState(!!showAnswer);
  if (attempt.status === "grading") {
    return <div className="sheet" style={{ padding: 22 }}><div className="pulse-dot" style={{ fontSize: 15, fontWeight: 650 }}>Marking your answer…</div><div style={{ fontSize: 13, color: C.textMid, marginTop: 6 }}>Checking your structure, assumptions and arithmetic. Usually a few seconds.</div></div>;
  }
  if (attempt.status !== "graded") {
    return (
      <div className="sheet" style={{ padding: 22 }}>
        <div style={{ fontSize: 15, fontWeight: 650 }}>{attempt.status === "error" ? "This answer wasn't graded" : "Answer saved"}</div>
        <div style={{ fontSize: 13, color: attempt.status === "error" ? C.red : C.textMid, marginTop: 6, lineHeight: 1.5 }}>{attempt.status === "error" ? attempt.error : "It's in your History. Sign in to get it graded. New accounts get 20 free credits."}</div>
        <div style={{ display: "flex", gap: 8, marginTop: 14, flexWrap: "wrap" }}>
          {session ? <PrimaryButton onClick={() => onGrade(attempt.id)}>Grade this answer</PrimaryButton> : <PrimaryButton onClick={onOpenAccount}>Sign in to grade</PrimaryButton>}
          {onRetry && <GhostButton onClick={onRetry}>Try this question again</GhostButton>}
        </div>
        <RewardFeed reward={reward} />
      </div>
    );
  }
  const g = attempt.grade;
  const block = (title, body) => body ? <div style={{ marginTop: 18 }}><h3 style={{ margin: "0 0 6px", fontSize: 13.5, fontWeight: 650 }}>{title}</h3>{body}</div> : null;
  const bullets = (items) => items.length ? <ul style={{ margin: 0, paddingLeft: 18, fontSize: 13.5, lineHeight: 1.6 }}>{items.map((t, i) => <li key={i} style={{ marginBottom: 3 }}>{t}</li>)}</ul> : null;
  return (
    <div className="sheet" style={{ padding: 24 }}>
      <div style={{ display: "flex", gap: 28, alignItems: "center", flexWrap: "wrap" }}>
        <RedPenScore value={g.overall} />
        <div style={{ flex: "1 1 280px", minWidth: 0 }}>
          <p style={{ margin: "0 0 14px", fontSize: 15, lineHeight: 1.5 }}>{g.verdict}</p>
          <RubricBars scores={g.scores} />
        </div>
      </div>
      <RewardFeed reward={reward} />
      <div className="eos-grid" style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 20 }}>
        {block("What worked", bullets(g.strengths))}
        {block("What cost you points", bullets(g.improvements))}
      </div>
      {block("A stronger approach", <p style={{ margin: 0, fontSize: 13.5, lineHeight: 1.65 }}>{g.modelApproach}</p>)}
      {g.mathIssues && block("Math to fix", <p style={{ margin: 0, fontSize: 13.5, lineHeight: 1.6, color: C.red }}>{g.mathIssues}</p>)}
      {g.nextStep && <p style={{ margin: "18px 0 0", background: C.paleBlue, borderRadius: 10, padding: "11px 13px", fontSize: 13.5, color: C.navy, lineHeight: 1.5 }}><strong>Next attempt:</strong> {g.nextStep}</p>}
      <div style={{ marginTop: 14, fontSize: 12.5, color: C.textDim }}>Answered in {fmtClock(attempt.timeSec || 0)}{attempt.hintUsed ? " with the hint" : ""} on {fmtDate(new Date(attempt.createdAt))}.</div>
      <div style={{ marginTop: 12 }}>
        <button onClick={() => setAnswerOpen((v) => !v)} aria-expanded={answerOpen} style={{ background: "none", border: "none", color: C.navy, fontSize: 13, fontWeight: 650, cursor: "pointer", padding: 0, fontFamily: FONT }}>{answerOpen ? "Hide your answer" : "Show your answer"}</button>
        {answerOpen && <div style={{ marginTop: 8, whiteSpace: "pre-wrap", fontSize: 13.5, lineHeight: 1.6, background: C.panelAlt, borderRadius: 10, padding: "12px 14px" }}>{attempt.response}</div>}
      </div>
      <div style={{ display: "flex", gap: 8, marginTop: 18, flexWrap: "wrap" }}>
        {onNext && <PrimaryButton onClick={onNext}>Next question</PrimaryButton>}
        {onRetry && <GhostButton onClick={onRetry}>Try this one again</GhostButton>}
        {onAskCoach && <GhostButton onClick={() => onAskCoach(attempt)}>Ask the coach about it</GhostButton>}
      </div>
    </div>
  );
}

/* ============================== HISTORY ============================== */
function HistoryView({ attempts, onOpen, onStartPractice }) {
  const [filter, setFilter] = useState("all");
  const list = attempts.filter((a) => filter === "all" || (filter === "graded" ? a.status === "graded" : a.status !== "graded"));
  const ungraded = attempts.filter((a) => a.status !== "graded").length;
  return (
    <div className="eos-page" style={{ maxWidth: 920 }}>
      <H1>History</H1>
      <Lede style={{ marginBottom: 18 }}>Every answer you've submitted. Open one to reread its marking, or grade one you saved while signed out.</Lede>
      <div style={{ display: "flex", gap: 8, marginBottom: 14, flexWrap: "wrap" }}>
        <Chip active={filter === "all"} onClick={() => setFilter("all")}>All ({attempts.length})</Chip>
        <Chip active={filter === "graded"} onClick={() => setFilter("graded")}>Graded</Chip>
        <Chip active={filter === "ungraded"} onClick={() => setFilter("ungraded")}>Needs grading ({ungraded})</Chip>
      </div>
      <div className="sheet" style={{ overflow: "hidden" }}>
        {list.length === 0 && (
          <div style={{ padding: 22 }}>
            <p style={{ margin: "0 0 12px", fontSize: 13.5, color: C.textMid }}>{attempts.length ? "Nothing matches this filter." : "No answers yet. Your first one shows up here with its marking."}</p>
            {!attempts.length && <PrimaryButton onClick={onStartPractice}>Go to practice</PrimaryButton>}
          </div>
        )}
        {list.map((a, i) => {
          const q = questionById(a.qid) || { prompt: "Unknown question" };
          return (
            <button key={a.id} onClick={() => onOpen(a.id)} className="press row-btn" style={{ width: "100%", display: "flex", alignItems: "center", gap: 14, padding: "14px 18px", border: "none", borderTop: i ? "1px solid " + C.borderSoft : "none", background: "transparent", cursor: "pointer", textAlign: "left", fontFamily: FONT }}>
              <div style={{ flex: 1, minWidth: 0 }}>
                <div style={{ fontSize: 14, fontWeight: 550, lineHeight: 1.4 }}>{q.prompt}</div>
                <div style={{ fontSize: 12, color: C.textMid, marginTop: 5 }}>{fmtDate(new Date(a.createdAt))}, {fmtClock(a.timeSec || 0)}{a.hintUsed ? ", used the hint" : ""}</div>
              </div>
              <AttemptBadge attempt={a} />
            </button>
          );
        })}
      </div>
    </div>
  );
}

/* ============================== COACH ============================== */
function CoachView({ profile, stats, game, attempts, recommendation, session, credits, refreshCredits, onOpenAccount, onStart, seed, clearSeed }) {
  const greetingText = session
    ? "Hi " + ((profile.name || "there").split(" ")[0]) + ". I can see your scores, your rubric breakdown and your recent answers. Ask me how to break a question down, why you're losing points, or for something to practice."
    : "Sign in at the top right to talk to me. New accounts get 20 free credits.";
  const [messages, setMessages] = useState([{ id: "m0", from: "coach", text: greetingText }]);
  const [input, setInput] = useState(seed || "");
  const [sending, setSending] = useState(false);
  const historyRef = React.useRef([]);
  const bottomRef = React.useRef(null);
  useEffect(() => { if (seed) { setInput(seed); clearSeed(); } }, [seed]);
  useEffect(() => { setMessages((m) => (m.length === 1 ? [{ id: "m0", from: "coach", text: greetingText }] : m)); }, [!!session]);
  useEffect(() => { if (bottomRef.current) bottomRef.current.scrollIntoView({ behavior: "smooth", block: "end" }); }, [messages]);

  const send = async (raw) => {
    const text = (raw || "").trim();
    if (!text || sending) return;
    setInput("");
    const userMsg = { id: "u" + Date.now(), from: "user", text };
    if (!session) { setMessages((m) => [...m, userMsg, { id: "c" + Date.now(), from: "coach", text: "Sign in first, at the top right. New accounts get 20 free credits." }]); onOpenAccount(); return; }
    const replyId = "c" + Date.now();
    setMessages((m) => [...m, userMsg, { id: replyId, from: "coach", text: "Thinking…", typing: true }]);
    setSending(true);
    const turnId = newTurnId();
    const gameLine = "\nGame progress: level " + game.level.level + " (" + game.level.title + "), " + game.level.xp + " XP. Today's quests: " + game.todayQuests.map((q) => q.label + (q.done ? " (done)" : "")).join("; ") + ".";
    let working = [{ role: "system", content: buildCoachSystemPrompt({ profile, stats, attempts, recommendation }) + gameLine }, ...historyRef.current, { role: "user", content: text }];
    let offered = null;
    window.__eosToolHandler = (name, args) => { if (name !== "open_question") return { ok: false }; const q = pickQuestion(args, attempts); if (!q) return { ok: false, error: "No matching question." }; offered = q; return { ok: true, questionId: q.id, prompt: q.prompt, category: categoryByKey(q.cat).label, difficulty: q.difficulty }; };
    try {
      let finalText = "";
      for (let round = 0; round < 4; round++) {
        const data = await callChat(session, working, turnId, COACH_TOOL_SCHEMAS.map((t) => ({ type: "function", function: t })));
        const message = ((data.choices || [])[0] || {}).message || {};
        const calls = message.tool_calls || [];
        if (calls.length) {
          const call = calls[0];
          let args = {};
          try { args = JSON.parse(call.function.arguments || "{}"); } catch (e) { args = {}; }
          const result = window.__eosToolHandler(call.function.name, args);
          working = working.concat([{ role: "assistant", content: message.content || null, tool_calls: calls }, { role: "tool", tool_call_id: call.id, content: JSON.stringify(result) }]);
          continue;
        }
        finalText = message.content || "";
        working = working.concat([{ role: "assistant", content: finalText }]);
        break;
      }
      historyRef.current = working.slice(1).slice(-16);
      setMessages((m) => m.map((x) => (x.id === replyId ? { id: replyId, from: "coach", text: finalText || "…", qid: offered ? offered.id : null } : x)));
    } catch (err) {
      const msg = err.code === "no_credits" ? "You're out of credits. Buy more from the account menu at the top right." : err.code === "rate_limited" ? "The coach is busy. Your credit wasn't used. Try again in a minute." : "Couldn't reach the coach. " + (err.message || "");
      setMessages((m) => m.map((x) => (x.id === replyId ? { id: replyId, from: "coach", text: msg } : x)));
    } finally {
      setSending(false);
      refreshCredits();
    }
  };

  return (
    <div className="eos-page" style={{ maxWidth: 920 }}>
      <H1>Coach</H1>
      <Lede style={{ marginBottom: 18 }}>Ask about breaking questions down, picking assumptions, quick mental math, or your scores. Each message uses one credit.</Lede>
      <div className="sheet coach-card" style={{ padding: 20, marginBottom: 14, display: "flex", flexDirection: "column" }}>
        {messages.map((m) => {
          const q = m.qid ? questionById(m.qid) : null;
          return (
            <div key={m.id}>
              <CoachMessage from={m.from} text={m.text} typing={m.typing} />
              {q && (
                <button className="press" onClick={() => onStart(q.id)} style={{ margin: "-4px 0 14px", display: "flex", alignItems: "center", gap: 10, maxWidth: "82%", textAlign: "left", background: C.navy, color: "#fff", border: "none", borderRadius: 12, padding: "10px 14px", cursor: "pointer", fontFamily: FONT }}>
                  <Icons.Target size={14} color={C.gold} />
                  <span style={{ fontSize: 13, lineHeight: 1.4 }}><strong>Start:</strong> {q.prompt}</span>
                </button>
              )}
            </div>
          );
        })}
        <div ref={bottomRef} />
      </div>
      <div style={{ display: "flex", gap: 8, flexWrap: "wrap", marginBottom: 12 }}>{COACH_QUICK.map((q) => <Chip key={q} active={false} onClick={() => send(q)}>{q}</Chip>)}</div>
      <div style={{ display: "flex", gap: 8, alignItems: "flex-end" }}>
        <textarea value={input} onChange={(e) => setInput(e.target.value)} onKeyDown={(e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(input); } }} rows={input.length > 90 ? 4 : 1} aria-label="Message the coach" placeholder="Ask anything. Enter sends, Shift+Enter adds a line." style={{ ...inputStyle, flex: 1, resize: "vertical", lineHeight: 1.5, fontSize: 14, background: C.panel }} />
        <PrimaryButton onClick={() => send(input)} style={{ opacity: sending ? 0.6 : 1 }}>Send</PrimaryButton>
      </div>
    </div>
  );
}

/* ============================== SETTINGS & WELCOME ============================== */
function ProfileFields({ draft, setDraft }) {
  return (
    <div>
      <FieldLabel>Your name</FieldLabel>
      <TextInput value={draft.name} onChange={(e) => setDraft({ ...draft, name: e.target.value })} placeholder="First name is fine" />
      <div style={{ marginTop: 16 }}><FieldLabel>What are you preparing for?</FieldLabel></div>
      <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>{GOALS.map((g) => <Chip key={g} active={draft.goal === g} onClick={() => setDraft({ ...draft, goal: g })}>{g}</Chip>)}</div>
      <div style={{ marginTop: 16 }}><FieldLabel>How much guesstimate practice have you done?</FieldLabel></div>
      <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>{LEVELS.map((l) => <Chip key={l} active={draft.level === l} onClick={() => setDraft({ ...draft, level: l })}>{l}</Chip>)}</div>
    </div>
  );
}
function SettingsView({ profile, setProfile, onReset }) {
  const [draft, setDraft] = useState(profile);
  const [saved, setSaved] = useState(false);
  return (
    <div className="eos-page" style={{ maxWidth: 660 }}>
      <H1 style={{ marginBottom: 18 }}>Profile & settings</H1>
      <div className="sheet" style={{ padding: 22, marginBottom: 16 }}>
        <ProfileFields draft={draft} setDraft={(d) => { setDraft(d); setSaved(false); }} />
        <div style={{ display: "flex", alignItems: "center", gap: 10, marginTop: 18 }}>
          <PrimaryButton onClick={() => { setProfile({ ...draft, name: draft.name.trim() || profile.name }); setSaved(true); }}>Save profile</PrimaryButton>
          {saved && <span style={{ fontSize: 13, color: C.green }}>Saved</span>}
        </div>
      </div>
      <div className="sheet" style={{ padding: 22 }}>
        <SectionHead>Your data</SectionHead>
        <p style={{ margin: "0 0 12px", fontSize: 13, color: C.textMid, lineHeight: 1.55 }}>Answers, drafts, scores and XP live in this browser. Deleting them can't be undone. Your credits aren't affected.</p>
        <GhostButton onClick={() => { if (window.confirm("Delete all answers, drafts, scores and XP on this device?")) onReset(); }} style={{ color: C.red, borderColor: "#F3C4BF" }}>Delete all practice data</GhostButton>
      </div>
    </div>
  );
}
function WelcomeScreen({ onFinish }) {
  const [draft, setDraft] = useState({ name: "", goal: GOALS[0], level: LEVELS[0] });
  const [error, setError] = useState("");
  const start = () => { if (!draft.name.trim()) { setError("Add your name to continue."); return; } onFinish({ ...draft, name: draft.name.trim() }); };
  return (
    <div className="full-screen-shell graph-paper" style={{ display: "flex", alignItems: "center", justifyContent: "center", padding: 20, fontFamily: FONT, color: C.text }}>
      <div style={{ width: "100%", maxWidth: 540 }}>
        <Logo size={19} />
        <h1 style={{ margin: "24px 0 6px", fontSize: 36, fontWeight: 720, letterSpacing: -1.2, lineHeight: 1.1 }}>How many piano tuners are in Chicago?</h1>
        <div style={{ fontFamily: HAND, fontSize: 28, color: C.red, transform: "rotate(-2deg)", margin: "0 0 14px" }}>Show your working. We'll mark it.</div>
        <p style={{ margin: "0 0 24px", fontSize: 14.5, color: C.textMid, lineHeight: 1.6 }}>Fifty guesstimates across ten categories. Each answer is scored on structure, assumptions, math, sanity check and clarity, and earns XP toward your next level.</p>
        <div className="sheet" style={{ padding: 22 }}>
          <ProfileFields draft={draft} setDraft={(d) => { setDraft(d); setError(""); }} />
          {error && <div role="alert" style={{ marginTop: 12, fontSize: 13, color: C.red }}>{error}</div>}
          <PrimaryButton onClick={start} style={{ marginTop: 20, width: "100%", justifyContent: "center", padding: "12px 16px", fontSize: 14.5 }}>Start practicing</PrimaryButton>
        </div>
      </div>
    </div>
  );
}

/* ============================== ROOT ============================== */
function EstimateOS() {
  const persisted = useMemo(() => loadState(), []);
  const [profile, setProfile] = useState((persisted && persisted.profile) || null);
  const [attempts, setAttempts] = useState((persisted && persisted.attempts) || []);
  const [drafts, setDrafts] = useState((persisted && persisted.drafts) || {});
  const [insight, setInsight] = useState((persisted && persisted.insight) || null);
  const [active, setActive] = useState("dashboard");
  const [openQid, setOpenQid] = useState(null);
  const [resultId, setResultId] = useState(null);
  const [workspaceNonce, setWorkspaceNonce] = useState(0);
  const [modalAttemptId, setModalAttemptId] = useState(null);
  const [coachSeed, setCoachSeed] = useState("");
  const [toasts, setToasts] = useState([]);
  const [rewards, setRewards] = useState({});
  const [mobileNavOpen, setMobileNavOpen] = useState(false);
  const attemptsRef = React.useRef(attempts);
  const snapshotsRef = React.useRef({});
  useEffect(() => { attemptsRef.current = attempts; }, [attempts]);

  /* ---- Account: Supabase auth + credits (unchanged from before) ---- */
  const [session, setSession] = useState(null);
  const [credits, setCredits] = useState(null);
  const [accountOpen, setAccountOpen] = useState(false);
  const sessionRef = React.useRef(null);
  useEffect(() => { sessionRef.current = session; }, [session]);
  const refreshCredits = async (s) => {
    const cur = s || sessionRef.current;
    if (!sb || !cur || cur.artifact) { setCredits(null); return; }
    try { const res = await fetch("/api/me", { headers: { Authorization: "Bearer " + cur.access_token } }); if (res.ok) { const d = await res.json(); setCredits(d.credits); } } catch (e) { /* stale until next success */ }
  };
  useEffect(() => {
    if (!sb) return;
    sb.auth.getSession().then(({ data }) => { setSession(data.session); if (data.session) refreshCredits(data.session); });
    const { data: sub } = sb.auth.onAuthStateChange((_e, s) => { setSession(s); if (s) refreshCredits(s); else setCredits(null); });
    const params = new URLSearchParams(window.location.search);
    if (params.get("checkout")) { if (params.get("checkout") === "success") setAccountOpen(true); window.history.replaceState({}, "", window.location.pathname); }
    return () => sub.subscription.unsubscribe();
  }, []);
  const sendMagicLink = async (email) => {
    if (!sb) return { ok: false, message: "Sign-in isn't set up on this site." };
    const { error } = await sb.auth.signInWithOtp({ email, options: { emailRedirectTo: window.location.origin + window.location.pathname } });
    return error ? { ok: false, message: error.message } : { ok: true, message: "Check your email for the sign-in link." };
  };
  const signOutAccount = async () => { if (sb) await sb.auth.signOut(); };
  const buyCreditPack = async (pack) => {
    if (!session) return { ok: false, message: "Sign in first." };
    try {
      const res = await fetch("/api/checkout", { method: "POST", headers: { "Content-Type": "application/json", Authorization: "Bearer " + session.access_token }, body: JSON.stringify({ pack }) });
      const d = await res.json().catch(() => ({}));
      if (res.ok && d.url) { window.location.href = d.url; return { ok: true }; }
      return { ok: false, message: "Payments aren't set up yet. Your free credits still work." };
    } catch (e) { return { ok: false, message: "Couldn't open checkout. Check your connection and try again." }; }
  };

  useEffect(() => { if (profile) saveState({ profile, attempts, drafts, insight }); }, [profile, attempts, drafts, insight]);

  const stats = useMemo(() => computeStats(attempts), [attempts]);
  const game = useMemo(() => computeGame(attempts), [attempts]);
  const recommendation = useMemo(() => recommendNext(attempts, stats, profile || {}), [attempts, stats, profile]);

  const pushToast = (t) => setToasts((q) => [...q, t]);
  const celebrateReward = (reward) => {
    if (reward.levelUp) { pushToast({ kind: "level", mark: "Lv " + reward.levelUp.level, title: "Level up", desc: reward.levelUp.title }); celebrate("big"); }
    else if (reward.newBadges.length || reward.beatBest || reward.allQuests) celebrate("small");
    reward.newBadges.forEach((b) => pushToast({ kind: "badge", mark: b.mark, title: "Badge earned: " + b.label, desc: b.desc }));
    if (reward.allQuests) pushToast({ kind: "quest", mark: "3/3", title: "Today's quests done", desc: "+" + ALL_QUESTS_BONUS + " XP bonus" });
  };

  const updateAttempt = (id, patch) => { attemptsRef.current = attemptsRef.current.map((a) => (a.id === id ? { ...a, ...patch } : a)); setAttempts(attemptsRef.current); };
  const setDraft = (qid, text) => setDrafts((d) => ({ ...d, [qid]: text }));

  const runGrade = async (attemptId) => {
    const s = sessionRef.current;
    const attempt = attemptsRef.current.find((a) => a.id === attemptId);
    if (!attempt) return;
    if (!s) { setAccountOpen(true); return; }
    const presubmit = snapshotsRef.current[attemptId];
    delete snapshotsRef.current[attemptId];
    const before = presubmit || computeGame(attemptsRef.current);
    updateAttempt(attemptId, { status: "grading", error: null });
    try {
      const history = gradedAttempts(attemptsRef.current).filter((a) => a.id !== attemptId).slice(0, 5);
      const grade = await gradeWithAI({ session: s, attempt, question: questionById(attempt.qid), profile, history });
      updateAttempt(attemptId, { status: "graded", grade, gradedAt: new Date().toISOString() });
      const after = computeGame(attemptsRef.current);
      const reward = rewardDiff(before, after, attempt, attemptsRef.current, !!presubmit);
      setRewards((r) => ({ ...r, [attemptId]: reward }));
      celebrateReward(reward);
      if (grade.trendInsight || grade.nextStep) setInsight({ text: grade.trendInsight, nextStep: grade.nextStep, updatedAt: new Date().toISOString() });
    } catch (e) {
      const message = e.code === "no_credits" ? "You're out of credits. Buy more from the account menu, then grade it again."
        : e.code === "rate_limited" ? "The grader is busy. Your credit wasn't used. Try again in a minute."
        : e.code === "parse" ? "The grader sent back something unreadable. Try grading again."
        : e.code === "auth" ? e.message
        : "Couldn't reach the grader. " + (e.message || "");
      updateAttempt(attemptId, { status: "error", error: message });
    } finally { refreshCredits(); }
  };
  const submitAttempt = ({ qid, response, timeSec, hintUsed }) => {
    const before = computeGame(attemptsRef.current);
    const attempt = { id: uid(), qid, response, timeSec, hintUsed, createdAt: new Date().toISOString(), status: session ? "grading" : "pending", grade: null };
    attemptsRef.current = [attempt, ...attemptsRef.current];
    setAttempts(attemptsRef.current);
    setDrafts((d) => { const n = { ...d }; delete n[qid]; return n; });
    setResultId(attempt.id);
    if (session) { snapshotsRef.current[attempt.id] = before; runGrade(attempt.id); }
    else { const reward = rewardDiff(before, computeGame(attemptsRef.current), attempt, attemptsRef.current, true); setRewards((r) => ({ ...r, [attempt.id]: reward })); celebrateReward(reward); }
  };
  const startQuestion = (qid) => { setOpenQid(qid); setResultId(null); setWorkspaceNonce((n) => n + 1); setModalAttemptId(null); setActive("practice"); };
  const askCoachAbout = (attempt) => {
    const q = questionById(attempt.qid) || {};
    const g = attempt.grade;
    setCoachSeed("I answered \"" + q.prompt + "\"" + (g ? " and scored " + g.overall + ". The grader said: " + g.verdict : "") + "\n\nMy answer:\n" + (attempt.response || "").slice(0, 900) + "\n\nWhat should I change to score higher?");
    setModalAttemptId(null);
    setActive("coach");
  };
  const resetData = () => { attemptsRef.current = []; setAttempts([]); setDrafts({}); setInsight(null); setOpenQid(null); setResultId(null); setRewards({}); };

  if (!profile) return <WelcomeScreen onFinish={(p) => setProfile(p)} />;

  const go = (k) => { setActive(k); if (k !== "practice") setOpenQid(null); };
  const navLabel = (NAV_ITEMS.find((n) => n.key === active) || {}).label || (active === "settings" ? "Profile & settings" : "");
  const openQuestion = openQid ? questionById(openQid) : null;
  const resultAttempt = resultId ? attempts.find((a) => a.id === resultId && a.qid === openQid) : null;
  const modalAttempt = modalAttemptId ? attempts.find((a) => a.id === modalAttemptId) : null;

  let content;
  if (active === "dashboard") content = <DashboardView profile={profile} stats={stats} game={game} insight={insight} recommendation={recommendation} onStart={startQuestion} onOpenAttempt={setModalAttemptId} setActive={go} />;
  else if (active === "practice") content = openQuestion
    ? <PracticeWorkspace key={openQid + ":" + workspaceNonce} question={openQuestion} draft={drafts[openQid]} setDraft={setDraft} onBack={() => { setOpenQid(null); setResultId(null); }} onSubmit={submitAttempt} resultAttempt={resultAttempt} reward={resultAttempt ? rewards[resultAttempt.id] : null} bestScore={stats.bestByQ[openQid]} session={session} onOpenAccount={() => setAccountOpen(true)} onGrade={runGrade} onRetry={() => startQuestion(openQid)} onNext={() => startQuestion(recommendation.question.id)} onAskCoach={askCoachAbout} />
    : <PracticeLibrary attempts={attempts} stats={stats} drafts={drafts} onStart={startQuestion} recommendation={recommendation} />;
  else if (active === "history") content = <HistoryView attempts={attempts} onOpen={setModalAttemptId} onStartPractice={() => go("practice")} />;
  else if (active === "coach") content = <CoachView profile={profile} stats={stats} game={game} attempts={attempts} recommendation={recommendation} session={session} credits={credits} refreshCredits={refreshCredits} onOpenAccount={() => setAccountOpen(true)} onStart={startQuestion} seed={coachSeed} clearSeed={() => setCoachSeed("")} />;
  else if (active === "settings") content = <SettingsView profile={profile} setProfile={setProfile} onReset={resetData} />;

  return (
    <div className="app-shell" style={{ display: "flex", flexDirection: "column", width: "100%", background: C.bg, fontFamily: FONT, color: C.text, position: "relative", overflow: "hidden" }}>
      <div style={{ display: "flex", flex: 1, minHeight: 0 }}>
        <Sidebar active={active} setActive={go} game={game} />
        <div className="app-main-col" style={{ flex: 1, display: "flex", flexDirection: "column", minWidth: 0, overflow: "hidden" }}>
          <Topbar userName={profile.name} game={game} streak={stats.streak} viewLabel={navLabel} setMobileNavOpen={setMobileNavOpen} session={session} credits={credits} onOpenAccount={() => setAccountOpen(true)} />
          <main className="scoreos-canvas graph-paper" style={{ flex: 1, overflowY: "auto" }}>{content}</main>
        </div>
      </div>
      <MobileNavDrawer open={mobileNavOpen} onClose={() => setMobileNavOpen(false)} active={active} setActive={go} game={game} />
      <Modal open={!!modalAttempt} onClose={() => setModalAttemptId(null)} title={modalAttempt ? (questionById(modalAttempt.qid) || {}).prompt : ""} width={740}>
        {modalAttempt && <ResultPanel attempt={modalAttempt} reward={rewards[modalAttempt.id]} session={session} onOpenAccount={() => setAccountOpen(true)} onGrade={runGrade} onRetry={() => startQuestion(modalAttempt.qid)} onAskCoach={askCoachAbout} showAnswer />}
      </Modal>
      <GameToast toast={toasts[0] || null} onDone={() => setToasts((q) => q.slice(1))} />
      <AccountModal open={accountOpen} onClose={() => setAccountOpen(false)} session={session} credits={credits} onSendLink={sendMagicLink} onSignOut={signOutAccount} onBuyPack={buyCreditPack} />
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<EstimateOS />);

</script>
